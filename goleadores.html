<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goleadores Copa San Agustín</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --sea-deep: #08182e;
            --gold: #c9a84c;
            --gold-light: #e8c870;
            --marble: #f5f0e8;
            --bronze: #8e6a35;
            --text: #2a1f10;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(8, 24, 46, 0.9), rgba(8, 24, 46, 0.9)), 
                        url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header i {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(201,168,76,0.5));
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 10px 0;
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
        }

        .scorers-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .scorer-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.3s, background 0.3s;
            border-left: 4px solid transparent;
        }

        .scorer-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.15);
        }

        .scorer-card:nth-child(1) { border-left-color: var(--gold); background: rgba(201,168,76,0.15); }
        .scorer-card:nth-child(2) { border-left-color: #c0c0c0; }
        .scorer-card:nth-child(3) { border-left-color: #cd7f32; }

        .info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--gold);
            width: 30px;
        }

        .name {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .goals-count {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .goals-num {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1;
            color: var(--gold-light);
        }

        .goals-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        .footer-note {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <i class="fa-solid fa-shoe-prints"></i>
        <h2>Máximos Goleadores</h2>
        <p>Temporada 2026</p>
    </header>

    <div class="scorers-list">
        <!-- 1er Lugar -->
        <div class="scorer-card">
            <div class="info">
                <div class="rank">1°</div>
                <div class="name">Jorge Neira</div>
            </div>
            <div class="goals-count">
                <div class="goals-num">4</div>
                <div class="goals-label">Goles</div>
            </div>
        </div>

        <!-- 2do Lugar -->
        <div class="scorer-card">
            <div class="info">
                <div class="rank">2°</div>
                <div class="name">Victor Jiménez</div>
            </div>
            <div class="goals-count">
                <div class="goals-num">3</div>
                <div class="goals-label">Goles</div>
            </div>
        </div>

        <!-- 3er Lugar -->
        <div class="scorer-card">
            <div class="info">
                <div class="rank">3°</div>
                <div class="name">Gaspar Farías</div>
            </div>
            <div class="goals-count">
                <div class="goals-num">1</div>
                <div class="goals-label">Gol</div>
            </div>
        </div>
    </div>

    <p class="footer-note">⚽ Datos actualizados según actas de arbitraje oficiales.</p>
</div>

</body>
</html>
