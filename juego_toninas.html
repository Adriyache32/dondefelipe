<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐬 Memorice de Toninas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(160deg,#003d6b 0%,#005f99 50%,#0080b3 100%);
  min-height:100vh;font-family:'Segoe UI',Tahoma,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:14px;gap:10px;
}
h1{color:#fff;font-size:1.4rem;text-align:center;
   text-shadow:0 2px 8px rgba(0,0,0,.35);margin-top:4px;}
.subtitulo{color:rgba(255,255,255,.8);font-size:.82rem;text-align:center;}
.info{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.15);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.25);border-radius:20px;
  padding:5px 16px;color:#fff;font-size:.85rem;font-weight:600;}
.pill span{opacity:.7;font-weight:400;}
#mensaje{font-size:.95rem;color:#fff;min-height:1.4rem;text-align:center;
  font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.3);}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;width:100%;max-width:400px;
}

/* CARTA */
.carta{aspect-ratio:1;perspective:700px;cursor:pointer;}
.carta-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform .42s cubic-bezier(.4,0,.2,1);
  border-radius:14px;
}
.carta.volteada .carta-inner{transform:rotateY(180deg);}

.cara{
  position:absolute;inset:0;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:2px solid rgba(255,255,255,.18);
  box-shadow:0 4px 14px rgba(0,0,0,.22);
}

/* DORSO — ola de fondo */
.dorso{
  background:linear-gradient(135deg,#004a80,#00719e);
  font-size:1.5rem;gap:3px;
}
.ola{font-size:.75rem;opacity:.4;letter-spacing:3px;color:#fff;}

/* FRENTE */
.frente{
  transform:rotateY(180deg);
  background:linear-gradient(135deg,#0099cc,#00c4e4);
  font-size:2.5rem;
}

/* MATCHED */
.carta.matched .frente{
  background:linear-gradient(135deg,#007a5e,#00b87a)!important;
  box-shadow:0 0 0 3px #ffd700,0 4px 18px rgba(255,215,0,.35);
  border-color:#ffd700;
}
.carta.matched{animation:pop .38s ease-out;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* BOTÓN */
#btn{padding:9px 28px;background:#ffd700;color:#003d6b;border:none;
  border-radius:20px;font-size:.9rem;font-weight:700;cursor:pointer;
  box-shadow:0 3px 14px rgba(0,0,0,.22);transition:transform .15s;}
#btn:hover{transform:translateY(-2px);}

/* WIN */
#win{display:none;position:fixed;inset:0;background:rgba(0,30,60,.82);
  align-items:center;justify-content:center;z-index:99;}
#win.show{display:flex;}
#win-box{background:#fff;border-radius:22px;padding:2rem 2.5rem;
  text-align:center;max-width:300px;width:90%;}
#win-box .ico{font-size:3.5rem;display:block;margin-bottom:.5rem;}
#win-box h2{color:#003d6b;font-size:1.3rem;margin-bottom:.4rem;}
#win-box p{color:#555;font-size:.88rem;margin-bottom:1.2rem;line-height:1.5;}
#win-box button{padding:9px 24px;background:#005f99;color:#fff;border:none;
  border-radius:14px;font-size:.9rem;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<h1>🐬 Memorice de Toninas</h1>
<p class="subtitulo">¡Encuentra los 8 pares del mundo marino!</p>

<div class="info">
  <div class="pill"><span>Pares: </span><span id="pares">0 / 8</span></div>
  <div class="pill"><span>Intentos: </span><span id="intentos">0</span></div>
</div>

<div id="mensaje">¡Voltea las cartas y encuentra los pares! 🌊</div>

<div class="grid" id="grid"></div>

<button id="btn" onclick="init()">🔄 Nueva partida</button>

<div id="win">
  <div id="win-box">
    <span class="ico" id="win-ico">🏆</span>
    <h2>¡Lo lograste! 🐬</h2>
    <p id="win-msg"></p>
    <button onclick="document.getElementById('win').classList.remove('show');init()">
      Jugar de nuevo
    </button>
  </div>
</div>

<script>
const EMOJIS = ['🐬','🐟','🌊','🦑','🦐','🐙','🦀','🌿'];

let vol=[], matched=0, intentos=0, lock=false;

function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }

function init(){
  vol=[]; matched=0; intentos=0; lock=false;
  document.getElementById('pares').textContent    = '0 / 8';
  document.getElementById('intentos').textContent = '0';
  document.getElementById('mensaje').textContent  = '¡Voltea las cartas y encuentra los pares! 🌊';
  document.getElementById('win').classList.remove('show');

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  shuffle([...EMOJIS,...EMOJIS]).forEach(emoji=>{
    const el = document.createElement('div');
    el.className = 'carta';
    el.dataset.val = emoji;
    el.innerHTML = `
      <div class="carta-inner">
        <div class="cara dorso">
          <span>🐬</span>
          <span class="ola">〜〜〜〜</span>
        </div>
        <div class="cara frente">${emoji}</div>
      </div>`;
    el.addEventListener('click', ()=>voltear(el));
    grid.appendChild(el);
  });
}

function voltear(el){
  if(lock || el.classList.contains('volteada') || el.classList.contains('matched')) return;
  el.classList.add('volteada');
  vol.push(el);
  if(vol.length===2){
    intentos++;
    document.getElementById('intentos').textContent = intentos;
    lock=true;
    const [a,b]=vol;
    if(a.dataset.val===b.dataset.val){
      a.classList.add('matched'); b.classList.add('matched');
      matched++;
      document.getElementById('pares').textContent = `${matched} / 8`;
      const frases=['¡Muy bien! 🎉','¡Genial! ⭐','¡Correcto! 🐟','¡Fantástico! 🌊','¡Sí! 🐬'];
      document.getElementById('mensaje').textContent = frases[Math.floor(Math.random()*frases.length)];
      vol=[]; lock=false;
      if(matched===8){
        const ico = intentos<=10?'🏆':intentos<=14?'🥈':'🥉';
        const stars= intentos<=10?'⭐⭐⭐':intentos<=14?'⭐⭐':'⭐';
        document.getElementById('win-ico').textContent=ico;
        document.getElementById('win-msg').textContent=
          `${stars} Completaste los 8 pares en ${intentos} intentos. ¡Eres un experto en el mundo marino!`;
        setTimeout(()=>document.getElementById('win').classList.add('show'),500);
      }
    } else {
      document.getElementById('mensaje').textContent = 'Ese no es el par... ¡sigue buscando! 🔍';
      setTimeout(()=>{
        a.classList.remove('volteada'); b.classList.remove('volteada');
        vol=[]; lock=false;
        document.getElementById('mensaje').textContent='¡Voltea las cartas y encuentra los pares! 🌊';
      },1000);
    }
  }
}

init();
</script>
</body>
</html>
