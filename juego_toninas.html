<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐬 Memorice de Toninas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(160deg,#003d6b 0%,#005f99 50%,#0080b3 100%);
  min-height:100vh;font-family:'Segoe UI',sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:14px;gap:10px;
}

h1{color:#fff;font-size:1.3rem;text-align:center;letter-spacing:.5px;
   text-shadow:0 2px 8px rgba(0,0,0,.3);}
h1 span{font-size:1.6rem;}

.subtitulo{color:rgba(255,255,255,.8);font-size:.82rem;text-align:center;}

/* INFO BAR */
.info{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.pill{background:rgba(255,255,255,.15);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.25);border-radius:20px;
  padding:5px 14px;color:#fff;font-size:.82rem;font-weight:600;}
.pill span{opacity:.7;font-weight:400;}

/* MENSAJE */
#mensaje{font-size:.95rem;color:#fff;min-height:1.4rem;text-align:center;
  font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.3);}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  width:100%;max-width:520px;
}

/* CARTA */
.carta{
  aspect-ratio:.85;
  perspective:600px;
  cursor:pointer;
}
.carta-inner{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
  border-radius:12px;
}
.carta.volteada .carta-inner{transform:rotateY(180deg);}

.cara{
  position:absolute;inset:0;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:2px solid rgba(255,255,255,.15);
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}

/* DORSO */
.dorso{
  background:linear-gradient(135deg,#004a80,#006bb3);
  font-size:1.6rem;
  flex-direction:column;gap:4px;
}
.dorso-wave{font-size:.85rem;opacity:.4;letter-spacing:2px;}

/* FRENTE EMOJI */
.frente.tipo-emoji{
  background:linear-gradient(135deg,#0099cc,#00c2e0);
  transform:rotateY(180deg);
  font-size:2.4rem;
  flex-direction:column;gap:6px;
}
.tag-emoji{font-size:.58rem;color:rgba(255,255,255,.75);font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;}

/* FRENTE HECHO */
.frente.tipo-hecho{
  background:linear-gradient(135deg,#007a5e,#009e78);
  transform:rotateY(180deg);
  padding:10px 8px;
  text-align:center;
}
.hecho-txt{font-size:.72rem;color:#fff;line-height:1.45;font-weight:600;}
.tag-hecho{font-size:.58rem;color:rgba(255,255,255,.7);font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;margin-top:5px;}

/* MATCHED */
.carta.matched .cara.frente{
  box-shadow:0 0 0 3px #ffd700,0 4px 18px rgba(255,215,0,.4);
  border-color:#ffd700;
}
.carta.matched{animation:pulse .4s ease-out;}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

/* BOTÓN */
#btn-nuevo{
  padding:9px 26px;background:#ffd700;color:#003d6b;border:none;
  border-radius:20px;font-size:.9rem;font-weight:700;cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
  transition:transform .15s,box-shadow .15s;
}
#btn-nuevo:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(0,0,0,.25);}

/* WIN */
#win{display:none;position:fixed;inset:0;background:rgba(0,30,60,.8);
  align-items:center;justify-content:center;z-index:99;}
#win.show{display:flex;}
#win-box{background:#fff;border-radius:20px;padding:2rem 2.5rem;
  text-align:center;max-width:320px;width:90%;}
#win-box .trofeo{font-size:3rem;display:block;margin-bottom:.5rem;}
#win-box h2{color:#003d6b;font-size:1.3rem;margin-bottom:.4rem;}
#win-box p{color:#555;font-size:.88rem;margin-bottom:1.2rem;}
#win-box button{padding:9px 24px;background:#005f99;color:#fff;border:none;
  border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;}
#win-box button:hover{background:#003d6b;}

@media(max-width:400px){
  .grid{grid-template-columns:repeat(4,1fr);gap:5px;}
  .frente.tipo-emoji{font-size:1.8rem;}
  .hecho-txt{font-size:.65rem;}
}
</style>
</head>
<body>

<h1><span>🐬</span> MEMORICE DE TONINAS</h1>
<p class="subtitulo">Empareja cada imagen con su dato sobre la tonina chilena</p>

<div class="info">
  <div class="pill"><span>Pares: </span><span id="info-pares">0 / 8</span></div>
  <div class="pill"><span>Intentos: </span><span id="info-intentos">0</span></div>
</div>

<div id="mensaje">¡Encuentra los 8 pares! 🌊</div>

<div class="grid" id="grid"></div>

<button id="btn-nuevo" onclick="init()">🔄 Nueva partida</button>

<div id="win">
  <div id="win-box">
    <span class="trofeo" id="win-trofeo">🏆</span>
    <h2>¡Felicitaciones! 🐬</h2>
    <p id="win-msg"></p>
    <button onclick="document.getElementById('win').classList.remove('show');init()">
      Jugar de nuevo
    </button>
  </div>
</div>

<script>
const PARES = [
  { emoji:'🌊', hecho:'Viven en las costas del Pacífico de Chile' },
  { emoji:'🐟', hecho:'Comen peces, pulpos y crustáceos' },
  { emoji:'👨‍👩‍👧', hecho:'Viven en grupos llamados manadas' },
  { emoji:'🫁', hecho:'Respiran aire como tú, ¡son mamíferos!' },
  { emoji:'🍼', hecho:'La mamá amamanta a su cría con leche' },
  { emoji:'📡', hecho:'Usan ecos para encontrar su comida' },
  { emoji:'🚀', hecho:'Nadan a más de 30 km por hora' },
  { emoji:'🛡️', hecho:'Están en peligro y necesitan protección' },
];

let volteadas=[], matched=0, intentos=0, lock=false;

function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }

function init(){
  volteadas=[]; matched=0; intentos=0; lock=false;
  document.getElementById('info-pares').textContent   = '0 / 8';
  document.getElementById('info-intentos').textContent= '0';
  document.getElementById('mensaje').textContent       = '¡Encuentra los 8 pares! 🌊';
  document.getElementById('win').classList.remove('show');

  const cards = [];
  PARES.forEach((p,i)=>{
    cards.push({ id:i, tipo:'emoji', emoji:p.emoji, hecho:p.hecho });
    cards.push({ id:i, tipo:'hecho', emoji:p.emoji, hecho:p.hecho });
  });

  const grid = document.getElementById('grid');
  grid.innerHTML='';
  shuffle(cards).forEach(c=>{
    const el = document.createElement('div');
    el.className='carta';
    el.dataset.id   = c.id;
    el.dataset.tipo = c.tipo;
    el.innerHTML = `
      <div class="carta-inner">
        <div class="cara dorso">
          <span>🐬</span>
          <span class="dorso-wave">〜〜〜</span>
        </div>
        <div class="cara frente tipo-${c.tipo}">
          ${c.tipo==='emoji'
            ? `<span>${c.emoji}</span><span class="tag-emoji">¿Cuál dato?</span>`
            : `<span class="hecho-txt">${c.hecho}</span><span class="tag-hecho">¿Qué imagen?</span>`
          }
        </div>
      </div>`;
    el.addEventListener('click',()=>voltear(el));
    grid.appendChild(el);
  });
}

function voltear(el){
  if(lock||el.classList.contains('volteada')||el.classList.contains('matched')) return;
  el.classList.add('volteada');
  volteadas.push(el);

  if(volteadas.length===2){
    intentos++;
    document.getElementById('info-intentos').textContent = intentos;
    lock=true;

    const [a,b] = volteadas;
    if(a.dataset.id===b.dataset.id && a.dataset.tipo!==b.dataset.tipo){
      // ¡Par correcto!
      a.classList.add('matched'); b.classList.add('matched');
      matched++;
      document.getElementById('info-pares').textContent = `${matched} / 8`;
      document.getElementById('mensaje').textContent =
        matched===8 ? '¡Eres un experto en toninas! 🐬✨' :
        ['¡Muy bien! 🎉','¡Excelente! ⭐','¡Correcto! 🐟','¡Genial! 🌊'][Math.floor(Math.random()*4)];
      volteadas=[]; lock=false;
      if(matched===8){
        const estrellas = intentos<=10?'⭐⭐⭐':intentos<=14?'⭐⭐':'⭐';
        setTimeout(()=>{
          document.getElementById('win-trofeo').textContent =
            intentos<=10?'🏆':intentos<=14?'🥈':'🥉';
          document.getElementById('win-msg').textContent =
            `${estrellas} Completaste los 8 pares en ${intentos} intentos. ¡Eres un experto en toninas!`;
          document.getElementById('win').classList.add('show');
        },500);
      }
    } else {
      document.getElementById('mensaje').textContent = 'Eso no es un par... ¡sigue intentando! 🔍';
      setTimeout(()=>{
        a.classList.remove('volteada'); b.classList.remove('volteada');
        volteadas=[]; lock=false;
        document.getElementById('mensaje').textContent = '¡Encuentra los pares! 🌊';
      },1000);
    }
  }
}

init();
</script>
</body>
</html>
