name: Sync Fork
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      - name: Sync
        run: |
          git remote add upstream https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/fjimenez321-stack/dondefelipe.git
          git fetch upstream main
          git config user.name "bot"
          git config user.email "bot@adriyache32.github.io"
          git merge upstream/main --no-edit
          git push origin main
          echo "✅ Synced"
