<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesoros del Espacio — Física 4° Medio</title>
<style>
  :root { --primary: #00f2ff; --error: #ff4d4d; --bg: #03050F; }
  body {
    background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow: hidden; margin: 0;
  }
  .card {
    background: rgba(13, 27, 42, 0.9); border: 2px solid #1B7F8B;
    border-radius: 18px; padding: 40px; max-width: 500px; width: 90%;
    text-align: center; backdrop-filter: blur(10px); box-shadow: 0 0 40px rgba(27,127,139,0.3);
  }
  h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 20px; letter-spacing: 2px; }
  input {
    background: #0c1120; border: 1px solid #1B7F8B; color: var(--primary);
    padding: 15px; font-size: 1.5rem; text-align: center; width: 100px; border-radius: 8px;
    margin-bottom: 20px; outline: none;
  }
  .btn-tech {
    background: none; border: 1px solid var(--primary); color: var(--primary);
    padding: 12px 24px; cursor: pointer; font-weight: bold; transition: 0.3s;
  }
  .btn-tech:hover { background: rgba(0,242,255,0.1); box-shadow: 0 0 15px var(--primary); }
  #error-msg { color: var(--error); display: none; margin-top: 15px; font-size: 0.9rem; }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
</style>
</head>
<body>

<div class="card">
  <h1>SISTEMA DE ACCESO ESTELAR</h1>
  <p style="margin-bottom: 20px; opacity: 0.8;">Ingresa el código de frecuencia para liberar el tesoro.</p>
  
  <input type="password" id="code-input" maxlength="3" placeholder="***">
  <br>
  <button class="btn-tech" onclick="verifyCode()">VERIFICAR CÓDIGO</button>
  
  <p id="error-msg">⚠️ FRECUENCIA INCORRECTA: INTERFERENCIA DETECTADA</p>
</div>

<script>
  const CORRECT_CODE = "500";
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFcG4150ORc85aIqbrAmtfBrZAol-iXB2I4RDEFMB87ESzTpE7vpoYIYpSPWL28Mas/exec";

  // ── SISTEMA DE SONIDOS ESPACIALES ──
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'success') {
      // Alerta Espacial Heroica
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    } else {
      // Castigo: Agujero Negro / Descompresión
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.8);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);
    }
  }

  // ── LÓGICA DE REGISTRO ──
  async function registrarGanadores() {
    const equipo = prompt("¡CÓDIGO CORRECTO! 🚀\nIngresa el nombre de tu equipo para el Cuadro de Honor:");
    if (!equipo) return;

    const data = {
      title: "GANADOR_TESORO_ESPACIAL",
      members: equipo,
      roles: "Exploradores de 4to Medio",
      problem: "Misión: Tesoros del Espacio completada.",
      question: "Código 500 verificado",
      hypothesis: "Física Estelar",
      v_indep: "N/A", v_dep: "N/A",
      materials: "Ingenio Espacial", 
      procedure: "Descifrado de códigos de ondas y partículas"
    };

    try {
      await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data)
      });
      alert("¡Transmisión enviada! El Profe Felipe publicará al equipo ganador en las Novedades.");
    } catch (e) {
      console.error("Error de transmisión");
    }
  }

  function verifyCode() {
    const input = document.getElementById('code-input').value;
    const errorMsg = document.getElementById('error-msg');
    
    if (input === CORRECT_CODE) {
      playSound('success');
      registrarGanadores().then(() => {
        showSuccess();
      });
    } else {
      playSound('fail');
      errorMsg.style.display = 'block';
      const card = document.querySelector('.card');
      card.style.animation = 'shake 0.5s';
      setTimeout(() => card.style.animation = '', 500);
    }
  }

  function showSuccess() {
    document.querySelector('.card').innerHTML = `
      <div style="animation: fadeIn 1s ease;">
        <h2 style="color:#f0c840;">¡ACCESO CONCEDIDO!</h2>
        <p style="margin:20px 0;">Has sincronizado la frecuencia 500 con éxito.</p>
        <p style="font-size:0.8rem; color:var(--primary);">SISTEMA DESBLOQUEADO</p>
        <button class="btn-tech" onclick="window.close()" style="margin-top:20px;">SALIR DEL SISTEMA</button>
      </div>`;
  }
</script>

</body>
</html>
