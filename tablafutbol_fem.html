<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Damas 2026</title>
    <style>
        :root { --gold: #ffd700; --fem-accent: #ff4d94; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(rgba(20, 0, 30, 0.85), rgba(20, 0, 30, 0.85)), 
                        url('https://images.unsplash.com/photo-1560272564-c83b66b1ad12?auto=format&fit=crop&q=80&w=1000') center/cover;
            color: white; margin: 0; padding: 20px; display: flex; justify-content: center;
        }
        .container {
            width: 100%; max-width: 800px; background: rgba(30, 5, 40, 0.9);
            border-radius: 12px; padding: 25px; border: 2px solid var(--fem-accent); box-shadow: 0 0 30px rgba(255, 77, 148, 0.3);
        }
        h2 { text-align: center; color: var(--fem-accent); text-transform: uppercase; margin-bottom: 25px; text-shadow: 0 0 10px rgba(255,77,148,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { font-size: 0.75rem; color: #d896ff; padding: 12px; border-bottom: 1px solid #5a189a; }
        td { padding: 15px 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .team-name { text-align: left; font-weight: bold; }
        .pos { color: var(--gold); font-weight: 800; }
        .pts-box { background: rgba(255, 77, 148, 0.2); color: var(--fem-accent); font-weight: 900; border-radius: 4px; }
        .dg { color: #ffb7ff; }
    </style>
</head>
<body>
<div class="container">
    <h2>👑 Liga Damas San Agustín</h2>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th style="text-align:left">Equipo</th>
                <th>PJ</th>
                <th>GF</th>
                <th>GC</th>
                <th>DG</th>
                <th>PG</th>
                <th>PE</th>
                <th>PP</th>
                <th class="pts-box">PTS</th>
            </tr>
        </thead>
        <tbody>
            <tr><td class="pos">1</td><td class="team-name">Octavo Básico</td><td>1</td><td>3</td><td>1</td><td class="dg">+2</td><td>1</td><td>0</td><td>0</td><td class="pts-box">3</td></tr>
            <tr><td class="pos">2</td><td class="team-name">Segundo Medio</td><td>1</td><td>2</td><td>2</td><td class="dg">0</td><td>0</td><td>1</td><td>0</td><td class="pts-box">1</td></tr>
            <tr><td class="pos">3</td><td class="team-name">Tercero Medio</td><td>1</td><td>2</td><td>2</td><td class="dg">0</td><td>0</td><td>1</td><td>0</td><td class="pts-box">1</td></tr>
            <tr><td class="pos">4</td><td class="team-name">Cuarto Medio</td><td>0</td><td>0</td><td>0</td><td class="dg">0</td><td>0</td><td>0</td><td>0</td><td class="pts-box">0</td></tr>
            <tr><td class="pos">5</td><td class="team-name">Séptimo Básico</td><td>0</td><td>0</td><td>0</td><td class="dg">0</td><td>0</td><td>0</td><td>0</td><td class="pts-box">0</td></tr>
            <tr><td class="pos">6</td><td class="team-name">Sexto Básico</td><td>0</td><td>0</td><td>0</td><td class="dg">0</td><td>0</td><td>0</td><td>0</td><td class="pts-box">0</td></tr>
            <tr><td class="pos">7</td><td class="team-name">Primero Medio</td><td>1</td><td>1</td><td>3</td><td class="dg">-2</td><td>0</td><td>0</td><td>1</td><td class="pts-box">0</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
