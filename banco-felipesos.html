<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Banco Felipesos | El Rincón de Felipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --sea-deep:#060f1e; --sea-mid:#0c1f38; --sea-light:#163356;
  --gold:#c9a84c; --gold-light:#e8c870; --gold-bright:#f5d980; --gold-dark:#8b6914;
  --marble:#fdfbf7;
  --ff-title:'Cinzel','Palatino Linotype',Palatino,serif;
  --ff-body:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --tab-bank:#a8d8e8; --tab-bodega:#f5d873;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100vh; display:flex; flex-direction:column;
  font-family:var(--ff-body); color:#fff; background:var(--sea-deep);
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
body::after{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(26,64,104,.55) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 100%, rgba(12,31,56,.7) 0%, transparent 55%);
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(201,168,76,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(201,168,76,.04) 1px,transparent 1px);
  background-size:52px 52px;
}

/* Friso superior */
.frieze{
  position:relative; z-index:5; height:5px; flex-shrink:0;
  background:linear-gradient(90deg,var(--sea-deep) 0%,var(--gold-dark) 8%,var(--gold) 20%,var(--gold-bright) 35%,var(--gold) 50%,var(--gold-bright) 65%,var(--gold) 80%,var(--gold-dark) 92%,var(--sea-deep) 100%);
  box-shadow:0 0 18px rgba(201,168,76,.45),0 2px 8px rgba(0,0,0,.6);
}

/* Encabezado */
header{
  position:relative; z-index:5; flex-shrink:0;
  background:rgba(6,14,26,.92);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(201,168,76,.2);
  box-shadow:0 8px 40px rgba(0,0,0,.55);
}
.header-inner{
  max-width:1200px; margin:0 auto; padding:.9rem 1.2rem;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-family:var(--ff-title); color:var(--gold-light);
  font-size:1.1rem; letter-spacing:2px; font-weight:700;
}
.brand i{ color:var(--gold); filter:drop-shadow(0 0 6px rgba(201,168,76,.5)); }
.home-link{
  display:inline-flex; align-items:center; gap:8px;
  color:rgba(255,255,255,.8); text-decoration:none;
  font-family:var(--ff-body); font-size:.78rem; letter-spacing:.5px; font-weight:600;
  padding:9px 16px; border:1.5px solid rgba(201,168,76,.3); border-radius:9px;
  transition:all .25s;
}
.home-link:hover{ background:rgba(201,168,76,.08); border-color:var(--gold); color:var(--gold-light); }

/* Pestañas */
.tabs{
  display:flex; gap:10px; max-width:1200px; margin:1rem auto 0; padding:0 1.2rem; width:100%;
  position:relative; z-index:5;
}
.tab{
  flex:1; display:flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 18px; cursor:pointer;
  font-family:var(--ff-title); font-size:.74rem; letter-spacing:.12em; font-weight:700;
  color:rgba(255,255,255,.7);
  background:rgba(12,24,42,.7); border:1.5px solid rgba(201,168,76,.22);
  border-radius:12px 12px 0 0; border-bottom:none;
  transition:all .25s; min-height:48px;
}
.tab i{ font-size:.95rem; }
.tab:hover{ color:#fff; background:rgba(20,40,70,.8); }
.tab.active[data-tab="banco"]{ color:#082533; background:var(--tab-bank); border-color:var(--tab-bank); }
.tab.active[data-tab="bodega"]{ color:#2a1f00; background:var(--tab-bodega); border-color:var(--tab-bodega); }

/* Visor */
main{
  position:relative; z-index:5; flex:1; width:100%;
  max-width:1200px; margin:0 auto; padding:0 1.2rem 1.2rem;
  display:flex; flex-direction:column;
}
.viewer{
  flex:1; position:relative; min-height:78vh;
  border:1.5px solid rgba(201,168,76,.25); border-radius:0 0 14px 14px;
  overflow:hidden; background:var(--marble);
  box-shadow:0 18px 50px rgba(0,0,0,.4);
}
.viewer iframe{
  position:absolute; inset:0; width:100%; height:100%; border:none; display:block; background:#fff;
}
.pane{ display:none; }
.pane.active{ display:block; }

footer{
  position:relative; z-index:5; flex-shrink:0;
  background:rgba(4,9,18,.98); border-top:1px solid rgba(201,168,76,.15);
  padding:1rem; text-align:center;
  font-family:var(--ff-body); font-size:.7rem; letter-spacing:1.5px; color:rgba(255,255,255,.35);
}

/* Responsivo */
@media (max-width:600px){
  .header-inner{ padding:.8rem 1rem; }
  .brand{ font-size:.95rem; letter-spacing:1.5px; }
  .home-link{ font-size:.72rem; padding:8px 12px; }
  .tabs{ padding:0 .8rem; gap:8px; }
  .tab{ font-size:.66rem; padding:12px 10px; letter-spacing:.06em; }
  main{ padding:0 .8rem .8rem; }
  .viewer{ min-height:82vh; }
}
@supports (padding:env(safe-area-inset-bottom)){
  footer{ padding-bottom:calc(1rem + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>

<div class="frieze"></div>

<header>
  <div class="header-inner">
    <div class="brand"><i class="fa-solid fa-piggy-bank"></i> BANCO FELIPESOS</div>
    <a class="home-link" href="index.html"><i class="fa-solid fa-house"></i> Volver al inicio</a>
  </div>
</header>

<div class="tabs" role="tablist">
  <button class="tab active" data-tab="banco" role="tab" aria-selected="true" onclick="showPane('banco')">
    <i class="fa-solid fa-building-columns"></i> BANCO
  </button>
  <button class="tab" data-tab="bodega" role="tab" aria-selected="false" onclick="showPane('bodega')">
    <i class="fa-solid fa-warehouse"></i> BODEGA
  </button>
</div>

<main>
  <div class="viewer">
    <div class="pane active" id="pane-banco">
      <iframe src="banco-felipeso/index.html" title="Banco Felipesos" loading="eager"></iframe>
    </div>
    <div class="pane" id="pane-bodega">
      <iframe id="if-bodega" data-src="warehouse/index.html" title="Bodega / Warehouse" loading="lazy"></iframe>
    </div>
  </div>
</main>

<footer>EL RINCÓN DE FELIPE © <span id="yr"></span> · BANCO FELIPESOS</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  function showPane(name){
    // Carga diferida del iframe de la bodega la primera vez
    if(name === 'bodega'){
      var ifb = document.getElementById('if-bodega');
      if(ifb && !ifb.src){ ifb.src = ifb.getAttribute('data-src'); }
    }
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('active'); });
    document.getElementById('pane-' + name).classList.add('active');

    document.querySelectorAll('.tab').forEach(function(t){
      var active = t.getAttribute('data-tab') === name;
      t.classList.toggle('active', active);
      t.setAttribute('aria-selected', active ? 'true' : 'false');
    });
  }
</script>

</body>
</html>
