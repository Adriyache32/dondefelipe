<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sabiduría del Mundo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Paleta alineada con el index ── */
    :root {
      --gold:       #c9a84c;
      --gold-lt:    #e8c870;
      --gold-bright:#f5d980;
      --gold-dark:  #8b6914;
      --gold-glow:  rgba(201,168,76,.18);
      --ivory:      #fdfbf7;
      --marble:     #faf8f4;
      --stone:      #ede5d0;
      --ink:        #2a1f10;
      --ink-soft:   #604e35;
      --bronze:     #7a5820;
      --bronze-rich:#5c3f0e;
      --border-g:   rgba(201,168,76,.28);
      --ff-title:   'Cinzel', 'Palatino Linotype', Palatino, serif;
      --ff-body:    'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    }

    body {
      background: var(--ivory);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: var(--ff-body);
      color: var(--ink);
      padding: 18px 12px 20px;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo parchment sutil */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 20% 0%,  rgba(201,168,76,.06) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 100%, rgba(122,88,32,.05)  0%, transparent 50%);
    }

    /* Partículas doradas sutiles tipo polvo */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      background: var(--gold);
      border-radius: 50%;
      animation: twinkle var(--dur, 4s) ease-in-out infinite var(--del, 0s);
    }
    @keyframes twinkle {
      0%,100% { opacity: .04; transform: scale(1); }
      50%      { opacity: .22; transform: scale(1.5); }
    }

    /* ── Tarjeta principal ── */
    .card {
      position: relative; z-index: 10;
      width: min(460px, 100%);
      padding: 28px 28px 24px;
      background: var(--marble);
      border: 1px solid var(--border-g);
      border-top: 3px solid var(--gold);
      border-radius: 14px;
      box-shadow:
        0 0 0 1px rgba(201,168,76,.06),
        0 12px 40px rgba(0,0,0,.07),
        inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 0 40px rgba(201,168,76,.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Ornamentos de esquina */
    .card::before, .card::after {
      content: '⬧';
      position: absolute;
      font-size: 10px;
      color: var(--gold);
      opacity: .4;
    }
    .card::before { top: 12px; left: 16px; }
    .card::after  { bottom: 12px; right: 16px; }

    /* ── Título ── */
    .title-wrap { text-align: center; padding-bottom: 4px; }
    .title-wrap h1 {
      font-family: var(--ff-title);
      font-size: clamp(.95rem, 3.5vw, 1.2rem);
      letter-spacing: .14em;
      font-weight: 700;
      background: linear-gradient(90deg,
        var(--gold-dark) 0%, var(--gold) 30%, var(--gold-bright) 55%, var(--gold) 75%, var(--gold-dark) 100%);
      background-size: 280%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 7s linear infinite;
      line-height: 1.4;
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 280% 50%; }
    }
    .divider {
      margin: 10px auto 0;
      width: 70px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* ── Cookie ── */
    .cookie-stage {
      position: relative;
      width: 130px; height: 130px;
      cursor: pointer;
      perspective: 600px;
    }
    .cookie-stage:hover .cookie-svg {
      filter: drop-shadow(0 0 18px rgba(201,168,76,.55));
    }
    .cookie-svg {
      width: 130px; height: 130px;
      transition: filter .3s;
      transform-style: preserve-3d;
    }
    .crack-line { opacity: 0; transform-origin: center; transition: opacity .3s; }
    .opened .crack-line { opacity: 1; }

    .cookie-stage:not(.cracking):not(.opened) .cookie-svg {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-8px) rotate(2deg); }
    }

    .cracking .cookie-svg { animation: shake .55s ease-in-out forwards; }
    @keyframes shake {
      0%   { transform: rotate(0); }
      20%  { transform: rotate(-8deg) scale(1.05); }
      40%  { transform: rotate(8deg)  scale(1.08); }
      60%  { transform: rotate(-5deg) scale(1.06); }
      80%  { transform: rotate(4deg)  scale(1.04); }
      100% { transform: rotate(0)     scale(1); }
    }

    .half-top, .half-bot {
      transform-origin: center;
      transition: transform .6s cubic-bezier(.34,1.56,.64,1);
    }
    .opened .half-top { transform: translateY(-12px) rotate(-12deg); }
    .opened .half-bot { transform: translateY(12px)  rotate(12deg); }

    .opened .cookie-svg {
      animation: glow-pulse 2.5s ease-in-out infinite !important;
    }
    @keyframes glow-pulse {
      0%,100% { filter: drop-shadow(0 0 10px rgba(201,168,76,.35)); }
      50%      { filter: drop-shadow(0 0 26px rgba(201,168,76,.7)); }
    }

    /* ── Pergamino de sabiduría ── */
    .scroll-wrap {
      width: 100%; min-height: 76px;
      display: flex; align-items: center; justify-content: center;
    }
    .paper {
      position: relative;
      background: var(--stone);
      border-radius: 8px;
      padding: 16px 18px 14px;
      width: 100%;
      border: 1px solid rgba(201,168,76,.3);
      border-top: 2px solid rgba(201,168,76,.45);
      box-shadow: 0 2px 12px rgba(0,0,0,.06), inset 0 0 20px rgba(201,168,76,.04);
      opacity: 0;
      transform: scaleY(.35) translateY(8px);
      transition: opacity .5s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
    }
    .paper::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.8) 50%, transparent);
    }
    .paper.visible { opacity: 1; transform: scaleY(1) translateY(0); }

    .paper-text {
      font-family: var(--ff-body);
      font-style: italic;
      font-size: clamp(.92rem, 2.8vw, 1.05rem);
      color: var(--ink);
      line-height: 1.6;
      text-align: center;
      letter-spacing: .01em;
    }
    .paper-symbol {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 8px;
      opacity: .7;
      color: var(--bronze);
    }
    .paper-meta {
      margin-top: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      border-top: 1px solid rgba(42,31,16,.12);
      padding-top: 8px;
    }
    .paper-source {
      font-family: var(--ff-body);
      font-style: italic;
      font-size: .78rem;
      color: var(--ink-soft);
      letter-spacing: .02em;
      text-align: center;
    }
    .paper-tradition {
      display: inline-block;
      font-family: var(--ff-title);
      font-style: normal;
      font-size: .58rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ivory);
      background: var(--bronze-rich);
      padding: 2px 10px;
      border-radius: 20px;
      opacity: .85;
      margin-top: 2px;
    }
    .paper-num {
      position: absolute;
      bottom: 5px; right: 8px;
      font-size: .58rem;
      color: rgba(42,31,16,.3);
      letter-spacing: .06em;
    }
    .placeholder {
      font-family: var(--ff-body);
      font-style: italic;
      color: rgba(201,168,76,.5);
      font-size: .95rem;
      letter-spacing: .08em;
      text-align: center;
    }

    /* ── Botón ── */
    .btn-wrap { width: 100%; }
    .btn {
      width: 100%;
      padding: 13px 0;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      border: none;
      color: #fff;
      font-family: var(--ff-title);
      font-size: .68rem;
      letter-spacing: .2em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: filter .25s, transform .2s;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(201,168,76,.28);
      font-weight: 600;
    }
    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      transform: translateX(-100%);
      transition: transform .5s ease;
    }
    .btn:hover::before { transform: translateX(100%); }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(201,168,76,.4); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: default; transform: none; }

    /* ── Partículas ── */
    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 20;
      animation: burst var(--dur,1s) ease-out forwards;
    }
    @keyframes burst {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(0); }
    }

    /* ── Contador ── */
    .counter {
      font-family: var(--ff-title);
      font-size: .6rem;
      letter-spacing: .1em;
      color: rgba(201,168,76,.55);
      text-align: center;
      margin-top: -12px;
    }
  </style>
</head>
<body>

<!-- partículas doradas -->
<div class="stars" id="stars"></div>

<!-- card -->
<div class="card">
  <div class="title-wrap">
    <h1>Sabiduría<br>del Mundo</h1>
    <div class="divider"></div>
  </div>

  <!-- cookie -->
  <div class="cookie-stage" id="stage" title="Haz clic para abrir tu fortuna">
    <svg class="cookie-svg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="cookieGrad" cx="40%" cy="35%">
          <stop offset="0%"   stop-color="#e8c87a"/>
          <stop offset="55%"  stop-color="#c9913a"/>
          <stop offset="100%" stop-color="#8b5a1a"/>
        </radialGradient>
        <radialGradient id="shimmer" cx="35%" cy="30%">
          <stop offset="0%"  stop-color="#fff" stop-opacity=".22"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.5"/>
        </filter>
      </defs>

      <!-- shadow -->
      <ellipse cx="80" cy="148" rx="48" ry="8" fill="#000" opacity=".35" filter="url(#soft)"/>

      <!-- top half -->
      <g class="half-top">
        <path d="M28 80 C20 60 22 38 40 26 C54 16 70 14 80 14 C90 14 106 16 120 26 C138 38 140 60 132 80 Z"
              fill="url(#cookieGrad)" stroke="#a06820" stroke-width="1"/>
        <path d="M28 80 C20 60 22 38 40 26 C54 16 70 14 80 14 C90 14 106 16 120 26 C138 38 140 60 132 80 Z"
              fill="url(#shimmer)"/>
        <!-- dots decoration -->
        <circle cx="58" cy="42" r="3.5" fill="#a06820" opacity=".6"/>
        <circle cx="80" cy="34" r="2.5" fill="#a06820" opacity=".5"/>
        <circle cx="102" cy="42" r="3"  fill="#a06820" opacity=".6"/>
        <circle cx="70"  cy="58" r="2"  fill="#a06820" opacity=".4"/>
        <circle cx="92"  cy="55" r="2.5" fill="#a06820" opacity=".45"/>
      </g>

      <!-- bottom half -->
      <g class="half-bot">
        <path d="M28 80 C20 100 22 122 40 134 C54 144 70 146 80 146 C90 146 106 144 120 134 C138 122 140 100 132 80 Z"
              fill="url(#cookieGrad)" stroke="#a06820" stroke-width="1"/>
        <path d="M28 80 C20 100 22 122 40 134 C54 144 70 146 80 146 C90 146 106 144 120 134 C138 122 140 100 132 80 Z"
              fill="url(#shimmer)"/>
        <circle cx="58"  cy="118" r="3.5" fill="#a06820" opacity=".6"/>
        <circle cx="80"  cy="126" r="2.5" fill="#a06820" opacity=".5"/>
        <circle cx="102" cy="118" r="3"   fill="#a06820" opacity=".6"/>
        <circle cx="70"  cy="104" r="2"   fill="#a06820" opacity=".4"/>
        <circle cx="92"  cy="106" r="2.5" fill="#a06820" opacity=".45"/>
      </g>

      <!-- crack line (visible when opened) -->
      <line class="crack-line" x1="28" y1="80" x2="132" y2="80"
            stroke="#7a4410" stroke-width="2" stroke-dasharray="4 3" opacity=".8"/>
    </svg>
  </div>

  <!-- message -->
  <div class="scroll-wrap" id="scrollWrap">
    <p class="placeholder" id="placeholder">~ toca el sello para revelar ~</p>
    <div class="paper" id="paper">
      <p class="paper-symbol" id="paperSymbol"></p>
      <p class="paper-text" id="paperText"></p>
      <div class="paper-meta">
        <span class="paper-source" id="paperSource"></span>
        <span class="paper-tradition" id="paperTradition"></span>
      </div>
    </div>
  </div>

  <!-- button -->
  <div class="btn-wrap">
    <button class="btn" id="btn" onclick="openFortune()">✦ &nbsp; Revelar una Reflexión &nbsp; ✦</button>
  </div>

  <p class="counter" id="counter"></p>
</div>

<script>
const fortunes = [

    source: "Buda Gautama",

    tradition: "Judaísmo",
    symbol: "✡"
  },
  {

    source: "Hadith atribuido al Profeta Muhammad",

  },

    source: "Chandogya Upanishad",
    tradition: "Hinduismo",

  },
  {
    text: "No es la muerte lo que un hombre debería temer, sino el nunca haber empezado a vivir.",
    source: "Marco Aurelio — Meditaciones",
    tradition: "Estoicismo",
    symbol: "🏛"
  },
  {
    text: "Cuando amas, no digas 'Dios está en mi corazón', sino 'yo estoy en el corazón de Dios'.",
    source: "Khalil Gibran — El Profeta",
    tradition: "Misticismo",
    symbol: "✦"
  },
  {
    text: "Aprende como si fueras a vivir para siempre; vive como si fueras a morir mañana.",
    source: "Mahatma Gandhi",
    tradition: "Filosofía Jainista / Hindu",
    symbol: "🪷"
  },
  {
    text: "En el principio era el Verbo, y el Verbo estaba con Dios, y el Verbo era Dios.",
    source: "Evangelio de Juan 1:1",
    tradition: "Cristianismo",
    symbol: "✝"
  },
  {
    text: "El noble busca las causas en sí mismo; el hombre inferior las busca en los demás.",
    source: "Confucio — Analectas",
    tradition: "Confucianismo",
    symbol: "⛩"
  },
  {
    text: "¿Qué es el hombre para que te acuerdes de él? Lo has hecho poco menor que los ángeles y lo has coronado de gloria.",
    source: "Salmo 8 — Tanaj / Biblia",
    tradition: "Judaísmo / Cristianismo",
    symbol: "✡"
  },
  {
    text: "No existe ningún camino hacia la paz. La paz es el camino.",
    source: "A. J. Muste",
    tradition: "Cuaquerismo / Pacifismo",
    symbol: "☮"
  },
  {
    text: "La llama del amor arde más allá del razonamiento. Déjate quemar.",
    source: "Rumi — Masnavi",
    tradition: "Sufismo",
    symbol: "☽"
  },
  {
    text: "Shikata ga nai: lo que no puede evitarse debe ser aceptado con serenidad.",
    source: "Proverbio Japonés",
    tradition: "Zen / Shintoísmo",
    symbol: "⛩"
  },
  {
    text: "El universo es transformación; la vida es opinión.",
    source: "Marco Aurelio — Meditaciones IV",
    tradition: "Estoicismo",
    symbol: "🏛"
  },
  {

    source: "Avesta — Gathas de Zaratustra",
    tradition: "Zoroastrismo",

  },
  {

  {

    source: "Hadith — Abu Dawud",

  {

    source: "Dogen Zenji",
    tradition: "Budismo Zen",

  {

  {

  },
  {

    source: "David Viscott",
    tradition: "Filosofía Humanista",
    symbol: "⚖"
  },
];

let count = 0;
let usedIndices = [];
let isAnimating = false;

function getNextIndex() {
  if (usedIndices.length === fortunes.length) usedIndices = [];
  let idx;
  do { idx = Math.floor(Math.random() * fortunes.length); }
  while (usedIndices.includes(idx));
  usedIndices.push(idx);
  return idx;
}

function spawnParticles(x, y) {
  const colors = ['#c9a84c','#f0d080','#e8c87a','#fff8e1','#ffe082'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 5;
    const angle = Math.random() * Math.PI * 2;
    const dist  = 60 + Math.random() * 120;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${x}px; top:${y}px;
      --tx:${Math.cos(angle)*dist}px;
      --ty:${Math.sin(angle)*dist}px;
      --dur:${.6 + Math.random()*.8}s;
      box-shadow: 0 0 4px ${colors[0]};
    `;
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

function openFortune() {
  if (isAnimating) return;
  isAnimating = true;

  const stage   = document.getElementById('stage');
  const paper   = document.getElementById('paper');
  const paperText = document.getElementById('paperText');
  const paperNum  = document.getElementById('paperNum');
  const placeholder = document.getElementById('placeholder');
  const btn     = document.getElementById('btn');
  const counter = document.getElementById('counter');
  btn.disabled  = true;

  // reset paper
  paper.classList.remove('visible');
  stage.classList.remove('opened');

  // crack shake
  stage.classList.add('cracking');

  setTimeout(() => {
    stage.classList.remove('cracking');
    stage.classList.add('opened');

    // particles at cookie center
    const rect = stage.getBoundingClientRect();
    spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2);

    // pick fortune
    count++;
    const idx = getNextIndex();
    const f   = fortunes[idx];
    paperText.textContent      = f.text;
    document.getElementById('paperSymbol').textContent    = f.symbol;
    document.getElementById('paperSource').textContent    = '— ' + f.source;
    document.getElementById('paperTradition').textContent = f.tradition;
    counter.textContent = `Reflexión ${count} · ${f.tradition}`;

    // hide placeholder, show paper
    placeholder.style.display = 'none';
    setTimeout(() => {
      paper.classList.add('visible');
      btn.disabled  = false;
      isAnimating   = false;
      btn.textContent = '✦   Otra Reflexión   ✦';
    }, 300);
  }, 620);
}

// ── generate golden dust particles ─────────────────────
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = .8 + Math.random() * 2.5;
  s.style.cssText = `
    width:${sz}px; height:${sz}px;
    top:${Math.random()*100}%;
    left:${Math.random()*100}%;
    --dur:${3 + Math.random()*5}s;
    --del:${-Math.random()*5}s;
  `;
  starsEl.appendChild(s);
}
</script>
</body>
