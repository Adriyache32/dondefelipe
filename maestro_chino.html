<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro Ming · Chino Mandarín</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f7f7f8;
  --color-background-tertiary:#ebebeb;
  --color-text-primary:#0d0d0d;
  --color-text-secondary:#5a5a5a;
  --color-text-tertiary:#909090;
  --color-border-secondary:#d9d9e3;
  --color-border-tertiary:#e8e8e8;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:16px;font-family:var(--font-sans);}
#root{width:100%;max-width:860px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
/* ── PROXY: la API key vive en Apps Script, nunca en el frontend ── */
const PROXY_URL = 'TU_URL_PROXY_AQUI';

const { useState, useEffect, useRef, useCallback } = React;

/* ── DATOS ─────────────────────────────────────────────────────── */
const LESSONS = [
  { id: 0, num: "Intro",      name: "Bienvenida",   char: "你好", topic: "presentación motivadora y qué esperar del chino mandarín" },
  { id: 1, num: "Lección 1",  name: "Pinyin",       char: "pīn", topic: "el sistema pinyin: qué es, cómo funciona, iniciales y finales básicas" },
  { id: 2, num: "Lección 2",  name: "Los 4 tonos",  char: "声",  topic: "los 4 tonos del mandarín con ejemplos prácticos" },
  { id: 3, num: "Lección 3",  name: "Saludos",      char: "你好", topic: "saludos básicos: 你好, 谢谢, 对不起, 再见 con pronunciación" },
  { id: 4, num: "Lección 4",  name: "Números 1–10", char: "一",  topic: "los números del 1 al 10 en chino con caracteres y pinyin" },
  { id: 5, num: "Lección 5",  name: "Presentarse",  char: "我",  topic: "cómo presentarse: 我叫..., 我是..., preguntar el nombre" },
  { id: 6, num: "Lección 6",  name: "Caracteres",   char: "字",  topic: "introducción a los caracteres: radicales, trazos y los más comunes" },
  { id: 7, num: "Lección 7",  name: "Familia",      char: "家",  topic: "vocabulario de familia en chino: mamá, papá, hermano, hermana" },
  { id: 8, num: "Práctica",   name: "Conversa",     char: "说",  topic: "conversación libre sobre chino, cultura china, o lo que quieras" },
];

const QUICK = {
  0: ["¡Empecemos!", "¿Qué tan difícil es?", "¿Cuánto tiempo lleva?"],
  1: ["Dame un ejemplo", "¿Cómo se pronuncia?", "¿Y las vocales?"],
  2: ["Practica conmigo", "¿Y el tono neutro?", "Ponme a prueba"],
  3: ["Practicar saludos", "¿Formal vs informal?", "Ponme a prueba"],
  4: ["¿Y los números grandes?", "Practica conmigo", "Ponme a prueba"],
  5: ["Di mi nombre en chino", "¿Cómo pregunto el nombre?", "Ponme a prueba"],
  6: ["¿Cuántos caracteres hay?", "¿Cómo los memorizo?", "Ponme a prueba"],
  7: ["¿Y los abuelos?", "¿Cómo digo 'mi familia'?", "Ponme a prueba"],
  8: ["¿Cómo pido agua?", "Cuéntame sobre la cultura china", "¿Qué aprendo después?"],
};

const SYSTEM = `Eres el Maestro Ming, un tutor de chino mandarín paciente, amable y motivador. Tu estudiante habla español y aprende chino por placer, sin presión. Siempre hablas en español.

REGLAS:
- Explica de forma clara y simple con ejemplos concretos
- Siempre muestra pinyin junto a los caracteres: 你好 (nǐ hǎo)
- Incluye traducción al español
- Celebra el progreso
- Si no entiende, explica de otra manera
- Usa emojis con moderación
- Para tonos, usa marcas: ā á ǎ à
- Respuestas amenas, no muy largas

PREGUNTAS DE OPCIÓN MÚLTIPLE:
Al final de muchas explicaciones (de forma natural, no siempre), incluye UNA pregunta usando EXACTAMENTE este formato JSON, sin espacios extra ni texto después del bloque:

[QUIZ]{"q":"¿Pregunta?","o":["Opción A","Opción B","Opción C","Opción D"],"c":0,"exp":"Por qué es correcta en una frase"}[/QUIZ]

"c" = índice 0-3 de la opción correcta.
NO agregues texto después del bloque [QUIZ].
Cuando el estudiante responda (bien o mal), continúa con naturalidad.`;

/* ── UTILIDADES ─────────────────────────────────────────────────── */
function parseMsg(text) {
  const re = /\[QUIZ\]([\s\S]*?)\[\/QUIZ\]/;
  const m = text.match(re);
  if (!m) return { parts: [{ type: "text", content: text }] };
  const before = text.slice(0, m.index).trim();
  const after  = text.slice(m.index + m[0].length).trim();
  let quiz = null;
  try { quiz = JSON.parse(m[1].trim()); } catch {}
  const parts = [];
  if (before) parts.push({ type: "text", content: before });
  if (quiz)   parts.push({ type: "quiz", quiz });
  if (after)  parts.push({ type: "text", content: after });
  return { parts };
}

/* ── Llamada al proxy ────────────────────────────────────────────── */
async function callProxy(payload) {
  const fd = new URLSearchParams();
  fd.append('action', 'claude');
  fd.append('payload', JSON.stringify(payload));
  const res = await fetch(PROXY_URL, { method: 'POST', body: fd });
  return res.json();
}

/* ── COMPONENTES ─────────────────────────────────────────────────── */
function QuizWidget({ quiz, onAnswer }) {
  const [sel, setSel] = useState(null);

  const pick = (i) => {
    if (sel !== null) return;
    setSel(i);
    const ok = i === quiz.c;
    setTimeout(() => onAnswer(ok, quiz.o[i], quiz.o[quiz.c], quiz.exp), 350);
  };

  return (
    <div style={{ marginTop: 10, borderTop: "0.5px solid var(--color-border-tertiary)", paddingTop: 10 }}>
      <div style={{ fontSize: 13, fontWeight: 500, color: "var(--color-text-primary)", marginBottom: 8, lineHeight: 1.4 }}>
        🧠 {quiz.q}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {quiz.o.map((opt, i) => {
          const isCorrect = i === quiz.c;
          const isSelected = i === sel;
          let bg = "var(--color-background-primary)";
          let border = "0.5px solid var(--color-border-secondary)";
          let color = "var(--color-text-primary)";
          let dotBg = "var(--color-background-tertiary)";
          let dotColor = "var(--color-text-tertiary)";
          let dotText = String.fromCharCode(65 + i);

          if (sel !== null) {
            if (isCorrect) {
              bg = "#e8f5e9"; border = "1.5px solid #4caf50"; color = "#1b5e20";
              dotBg = "#4caf50"; dotColor = "white"; dotText = "✓";
            } else if (isSelected) {
              bg = "#ffebee"; border = "1.5px solid #ef5350"; color = "#b71c1c";
              dotBg = "#ef5350"; dotColor = "white"; dotText = "✗";
            }
          }

          return (
            <button key={i} onClick={() => pick(i)}
              style={{ textAlign: "left", padding: "7px 12px", borderRadius: 8, border, background: bg, color,
                cursor: sel === null ? "pointer" : "default", fontSize: 13, lineHeight: 1.4,
                transition: "all 0.2s", fontFamily: "var(--font-sans)", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: 20, height: 20, borderRadius: "50%", flexShrink: 0, background: dotBg,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 11, fontWeight: 500, color: dotColor, transition: "all 0.2s" }}>
                {dotText}
              </span>
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function AsstMsg({ msg, onAnswer }) {
  const { parts } = parseMsg(msg.text);
  return (
    <div style={{ padding: "10px 13px", borderRadius: 14, fontSize: 13.5, lineHeight: 1.65,
      color: "var(--color-text-primary)", background: "var(--color-background-secondary)",
      border: "0.5px solid var(--color-border-tertiary)" }}>
      {parts.map((p, i) =>
        p.type === "text"
          ? <div key={i} style={{ whiteSpace: "pre-wrap" }}>{p.content}</div>
          : <QuizWidget key={i} quiz={p.quiz} onAnswer={onAnswer} />
      )}
    </div>
  );
}

/* ── COMPONENTE PRINCIPAL ────────────────────────────────────────── */
export default function TutorChino() {
  const [lesson,  setLesson]  = useState(0);
  const [msgs,    setMsgs]    = useState([]);
  const [history, setHistory] = useState([]);
  const [input,   setInput]   = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, loading]);

  const callClaude = useCallback(async (userText, hist, lid) => {
    const l = LESSONS[lid];
    const isFirst = hist.length === 0;
    const prompt = isFirst
      ? `El estudiante inició "${l.name}". Tema: ${l.topic}. Introducción amigable (max 3 párrafos). Si el tema lo permite, termina con una pregunta de opción múltiple.`
      : userText;
    const apiMsgs = isFirst
      ? [{ role: "user", content: prompt }]
      : [...hist.slice(-10), { role: "user", content: prompt }];

    setLoading(true);
    try {
      const data = await callProxy({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: SYSTEM + `\n\nLección actual: "${l.name}" — ${l.topic}`,
        messages: apiMsgs,
      });
      const reply = data.content?.[0]?.text || "Hubo un error. ¡Intenta de nuevo!";
      setHistory([...apiMsgs, { role: "assistant", content: reply }]);
      setMsgs(prev => [...prev, { role: "assistant", text: reply }]);
    } catch {
      setMsgs(prev => [...prev, { role: "assistant", text: "Problema de conexión. ¡Intenta de nuevo!" }]);
    }
    setLoading(false);
  }, []);

  const sendMsg = useCallback(async (text) => {
    if (!text.trim() || loading) return;
    const t = text.trim();
    setMsgs(prev => [...prev, { role: "user", text: t }]);
    setInput("");
    await callClaude(t, history, lesson);
  }, [loading, history, lesson, callClaude]);

  const handleQuizAnswer = useCallback(async (ok, chosen, correct, exp) => {
    const display = ok
      ? `✅ ¡Correcto! Elegí "${chosen}".`
      : `❌ Respondí "${chosen}" (la correcta era "${correct}").`;
    setMsgs(prev => [...prev, { role: "user", text: display }]);

    const followUp = ok
      ? `El estudiante respondió correctamente: "${chosen}". Felicítalo muy brevemente y continúa la lección con el siguiente concepto.`
      : `El estudiante respondió "${chosen}" pero la correcta era "${correct}". Explicación: ${exp}. Explícale amablemente el error y refuerza el concepto.`;

    const l = LESSONS[lesson];
    const apiMsgs = [...history.slice(-10), { role: "user", content: followUp }];
    setLoading(true);
    try {
      const data = await callProxy({
        model: "claude-sonnet-4-20250514",
        max_tokens: 700,
        system: SYSTEM + `\n\nLección actual: "${l.name}" — ${l.topic}`,
        messages: apiMsgs,
      });
      const reply = data.content?.[0]?.text || "¡Muy bien! Sigamos.";
      setHistory(prev => [...prev, { role: "user", content: followUp }, { role: "assistant", content: reply }]);
      setMsgs(prev => [...prev, { role: "assistant", text: reply }]);
    } catch {
      setMsgs(prev => [...prev, { role: "assistant", text: "¡Muy bien! Continuemos." }]);
    }
    setLoading(false);
  }, [history, lesson]);

  const selectLesson = useCallback(async (id) => {
    if (loading) return;
    setLesson(id); setMsgs([]); setHistory([]);
    await callClaude("", [], id);
  }, [loading, callClaude]);

  useEffect(() => { callClaude("", [], 0); }, []);

  const red = "#c0392b";

  return (
    <div style={{ display: "flex", height: 580, border: "0.5px solid var(--color-border-tertiary)",
      borderRadius: 12, overflow: "hidden", background: "var(--color-background-primary)",
      fontFamily: "var(--font-sans)" }}>

      {/* ── SIDEBAR ── */}
      <div style={{ width: 185, minWidth: 185, borderRight: "0.5px solid var(--color-border-tertiary)",
        display: "flex", flexDirection: "column", background: "var(--color-background-secondary)", overflowY: "auto" }}>
        <div style={{ padding: "16px 14px 12px", borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
          <div style={{ fontSize: 17, fontWeight: 500, color: "var(--color-text-primary)", letterSpacing: -0.3 }}>
            学中文 <span style={{ color: red }}>•</span>
          </div>
          <div style={{ fontSize: 11, color: "var(--color-text-tertiary)", marginTop: 2 }}>Tu camino al mandarín</div>
        </div>
        <div style={{ flex: 1, padding: "8px 0" }}>
          {LESSONS.map(l => (
            <div key={l.id} onClick={() => selectLesson(l.id)}
              style={{ padding: "9px 14px", cursor: "pointer",
                borderLeft: `2.5px solid ${l.id === lesson ? red : "transparent"}`,
                background: l.id === lesson ? "var(--color-background-primary)" : "transparent",
                transition: "all 0.15s" }}>
              <div style={{ fontSize: 10, color: "var(--color-text-tertiary)", fontWeight: 500,
                textTransform: "uppercase", letterSpacing: 0.5 }}>{l.num}</div>
              <div style={{ fontSize: 13, color: l.id === lesson ? red : "var(--color-text-primary)",
                fontWeight: l.id === lesson ? 500 : 400, marginTop: 1, lineHeight: 1.3 }}>{l.name}</div>
              <div style={{ fontSize: 18, opacity: 0.4, float: "right", marginTop: -26 }}>{l.char}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── CHAT ── */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <div style={{ padding: "11px 16px", borderBottom: "0.5px solid var(--color-border-tertiary)",
          display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: "50%", background: red,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 14, color: "white", flexShrink: 0 }}>先</div>
          <div>
            <div style={{ fontSize: 14, fontWeight: 500, color: "var(--color-text-primary)" }}>Maestro Ming</div>
            <div style={{ fontSize: 11, color: loading ? red : "var(--color-text-tertiary)" }}>
              {loading ? "Escribiendo..." : "Listo para enseñar"}
            </div>
          </div>
        </div>

        <div style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
          {msgs.map((m, i) => (
            <div key={i} style={{ display: "flex", gap: 8, maxWidth: "90%",
              alignSelf: m.role === "user" ? "flex-end" : "flex-start",
              flexDirection: m.role === "user" ? "row-reverse" : "row" }}>
              <div style={{ width: 26, height: 26, borderRadius: "50%",
                background: m.role === "assistant" ? red : "var(--color-background-tertiary)",
                border: m.role === "user" ? "0.5px solid var(--color-border-tertiary)" : "none",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: m.role === "assistant" ? 12 : 11,
                color: m.role === "assistant" ? "white" : "var(--color-text-secondary)",
                flexShrink: 0, marginTop: 2 }}>
                {m.role === "assistant" ? "先" : "yo"}
              </div>
              {m.role === "assistant"
                ? <AsstMsg msg={m} onAnswer={handleQuizAnswer} />
                : <div style={{ padding: "9px 13px", borderRadius: 14, fontSize: 13.5, lineHeight: 1.65,
                    color: "white", background: red, whiteSpace: "pre-wrap" }}>{m.text}</div>
              }
            </div>
          ))}
          {loading && (
            <div style={{ display: "flex", gap: 8 }}>
              <div style={{ width: 26, height: 26, borderRadius: "50%", background: red,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 12, color: "white", flexShrink: 0 }}>先</div>
              <div style={{ padding: "12px 16px", borderRadius: 14, background: "var(--color-background-secondary)",
                border: "0.5px solid var(--color-border-tertiary)", display: "flex", gap: 5, alignItems: "center" }}>
                {[0,1,2].map(i =>
                  <div key={i} style={{ width: 6, height: 6, borderRadius: "50%",
                    background: "var(--color-text-tertiary)", animation: "bounce 1.2s infinite",
                    animationDelay: `${i*0.2}s` }} />
                )}
              </div>
            </div>
          )}
          <div ref={bottomRef} />
        </div>

        {/* Quick replies */}
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", padding: "0 16px 8px" }}>
          {(QUICK[lesson] || []).map(q => (
            <button key={q} onClick={() => sendMsg(q)} disabled={loading}
              style={{ fontSize: 11.5, padding: "4px 10px", borderRadius: 20,
                border: "0.5px solid var(--color-border-secondary)",
                background: "var(--color-background-secondary)",
                color: "var(--color-text-secondary)", cursor: "pointer",
                fontFamily: "var(--font-sans)" }}>
              {q}
            </button>
          ))}
        </div>

        {/* Input */}
        <div style={{ padding: "10px 16px 12px", borderTop: "0.5px solid var(--color-border-tertiary)",
          display: "flex", gap: 8, alignItems: "flex-end" }}>
          <textarea value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(input); } }}
            placeholder="Escribe aquí..." rows={1}
            style={{ flex: 1, resize: "none", border: "0.5px solid var(--color-border-secondary)",
              borderRadius: 8, padding: "9px 12px", fontSize: 13.5, fontFamily: "var(--font-sans)",
              color: "var(--color-text-primary)", background: "var(--color-background-primary)",
              minHeight: 38, maxHeight: 100, lineHeight: 1.5, outline: "none" }} />
          <button onClick={() => sendMsg(input)} disabled={!input.trim() || loading}
            style={{ width: 36, height: 36, borderRadius: "50%", background: red, border: "none",
              cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0, opacity: (!input.trim() || loading) ? 0.4 : 1 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white"
              strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>
      <style>{`@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TutorChino />);
</script>
</body>
</html>
