<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;color:#fff}
    h2{color:#0f0;font-size:1.4rem;margin-bottom:8px;letter-spacing:2px}
    #score{font-size:1.1rem;margin-bottom:10px;color:#0f0}
    canvas{border:2px solid #0f0;border-radius:4px;display:block;max-width:100%}
    #msg{margin-top:10px;font-size:.85rem;color:#666;text-align:center}
    #best{color:#ff0;font-size:.9rem;margin-bottom:6px}
  </style>
</head>
<body>
  <h2>🐍 SNAKE</h2>
  <div id="score">Puntos: 0</div>
  <div id="best">Récord: 0</div>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="msg">Flechas del teclado para mover · R para reiniciar<br>En móvil: desliza sobre el canvas</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const S=20,COLS=20,ROWS=20;
let snake,dir,nextDir,food,score,best=0,loop,running=false;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;running=true;
  food=newFood();
  document.getElementById('score').textContent='Puntos: 0';
  clearInterval(loop);
  loop=setInterval(tick,130);
}

function newFood(){
  let f;
  do{ f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}

function tick(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    clearInterval(loop);running=false;
    if(score>best){best=score;document.getElementById('best').textContent='Récord: '+best;}
    ctx.fillStyle='rgba(0,0,0,.65)';
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle='#f55';ctx.font='bold 38px monospace';ctx.textAlign='center';
    ctx.fillText('FIN DEL JUEGO',200,185);
    ctx.font='18px monospace';ctx.fillStyle='#aaa';
    ctx.fillText('Puntos: '+score,200,218);
    ctx.fillText('R = reiniciar',200,248);
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;document.getElementById('score').textContent='Puntos: '+score;food=newFood();
  }else{snake.pop();}
  draw();
}

function draw(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,400,400);
  // grid
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,400);ctx.stroke();}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*S);ctx.lineTo(400,j*S);ctx.stroke();}
  // food
  ctx.fillStyle='#f55';ctx.beginPath();
  ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-1,0,Math.PI*2);ctx.fill();
  // snake
  snake.forEach((seg,i)=>{
    ctx.fillStyle=i===0?'#00ff41':'#00aa2a';
    ctx.fillRect(seg.x*S+1,seg.y*S+1,S-2,S-2);
  });
}

document.addEventListener('keydown',e=>{
  if(!running&&(e.key==='r'||e.key==='R')){init();return;}
  switch(e.key){
    case'ArrowUp':   if(dir.y===0){nextDir={x:0,y:-1};}break;
    case'ArrowDown': if(dir.y===0){nextDir={x:0,y:1};}break;
    case'ArrowLeft': if(dir.x===0){nextDir={x:-1,y:0};}break;
    case'ArrowRight':if(dir.x===0){nextDir={x:1,y:0};}break;
    case'r':case'R':if(running)return;init();return;
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});

let tx=0,ty=0;
c.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
c.addEventListener('touchend',e=>{
  if(!running){init();return;}
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>20&&dir.x===0)nextDir={x:1,y:0};
    else if(dx<-20&&dir.x===0)nextDir={x:-1,y:0};
  }else{
    if(dy>20&&dir.y===0)nextDir={x:0,y:1};
    else if(dy<-20&&dir.y===0)nextDir={x:0,y:-1};
  }
},{passive:true});

init();draw();
</script>
</body>
</html>
