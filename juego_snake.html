<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Arcade Ultra</title>
  <style>
    :root {
      --neon: #00ff41;
      --neon-glow: rgba(0, 255, 65, 0.6);
      --bg: #050505;
    }
    body {
      background: var(--bg);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #game-wrapper {
      position: relative;
      border: 4px solid #222;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    #ui {
      width: 400px;
      background: #111;
      display: flex;
      justify-content: space-around;
      padding: 15px;
      border-bottom: 2px solid #222;
    }
    .stat { text-align: center; }
    .label { font-size: 10px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .val { font-size: 18px; color: var(--neon); font-weight: bold; }
    
    canvas { display: block; background: #000; }

    /* Pantallas */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .hidden { display: none !important; }

    h1 { color: var(--neon); text-shadow: 0 0 10px var(--neon); margin: 0 0 20px 0; }
    input {
      background: #111;
      border: 2px solid var(--neon);
      color: var(--neon);
      padding: 10px;
      font-size: 18px;
      text-align: center;
      width: 100px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    button {
      background: var(--neon);
      color: black;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 5px;
    }
    button:hover { background: #00cc33; transform: scale(1.05); }
    #final-info { margin-bottom: 20px; text-align: center; }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="ui">
      <div class="stat"><div class="label">Puntos</div><div id="ui-score" class="val">0</div></div>
      <div class="stat"><div class="label">Jugador</div><div id="ui-name" class="val">---</div></div>
      <div class="stat"><div class="label">Vidas</div><div id="ui-lives" class="val" style="color:#f33">❤❤❤</div></div>
    </div>

    <canvas id="c" width="400" height="400"></canvas>

    <div id="screen-start" class="overlay">
      <h1>SNAKE ARCADE</h1>
      <input type="text" id="name-in" maxlength="3" value="PLY">
      <button id="btn-start">EMPEZAR</button>
    </div>

    <div id="screen-over" class="overlay hidden">
      <h1 style="color:#f33">GAME OVER</h1>
      <div id="final-info"></div>
      <button id="btn-restart">REINTENTAR</button>
    </div>
  </div>

<script>
/**
 * MOTOR DE JUEGO MEJORADO
 */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tiles = canvas.width / gridSize;

// Variables de Juego
let snake, food, dir, nextDir, score, lives, loop, isPaused;
const animals = ['🐭', '🐹', '🐰', '🐿️'];

// Manejo de Interfaz
const scrStart = document.getElementById('screen-start');
const scrOver = document.getElementById('screen-over');
const valScore = document.getElementById('ui-score');
const valName = document.getElementById('ui-name');
const valLives = document.getElementById('ui-lives');

// --- Funciones Principales ---

function startMatch() {
  const name = document.getElementById('name-in').value.toUpperCase() || "PLY";
  valName.textContent = name;
  
  score = 0;
  lives = 3;
  isPaused = false;
  
  scrStart.classList.add('hidden');
  scrOver.classList.add('hidden');
  
  resetSnake();
  updateUI();
  
  if (loop) clearInterval(loop);
  loop = setInterval(tick, 100); // 10 FPS
}

function resetSnake() {
  snake = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  spawnFood();
}

function spawnFood() {
  food = {
    x: Math.floor(Math.random() * tiles),
    y: Math.floor(Math.random() * tiles),
    img: animals[Math.floor(Math.random() * animals.length)]
  };
  // Si aparece sobre la serpiente, re-intentar
  if (snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
}

function tick() {
  if (isPaused) return;

  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 1. Paredes (Atravesar)
  if (head.x < 0) head.x = tiles - 1;
  else if (head.x >= tiles) head.x = 0;
  if (head.y < 0) head.y = tiles - 1;
  else if (head.y >= tiles) head.y = 0;

  // 2. Colisión Cuerpo
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    handleHit();
    return;
  }

  snake.unshift(head);

  // 3. Comida
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateUI();
    spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function handleHit() {
  lives--;
  updateUI();
  isPaused = true;

  if (lives <= 0) {
    clearInterval(loop);
    document.getElementById('final-info').innerHTML = `Puntos: ${score}`;
    scrOver.classList.remove('hidden');
  } else {
    // Flash rojo y reinicio rápido
    ctx.fillStyle = 'rgba(255,0,0,0.5)';
    ctx.fillRect(0,0,400,400);
    setTimeout(() => {
      resetSnake();
      isPaused = false;
    }, 800);
  }
}

function updateUI() {
  valScore.textContent = score;
  valLives.textContent = "❤".repeat(lives).padEnd(3, "🖤");
}

function draw() {
  // Fondo neón
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,400,400);
  
  // Rejilla
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1;
  for(let i=0; i<=400; i+=gridSize) {
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(400,i); ctx.stroke();
  }

  // Comida
  ctx.font = "16px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(food.img, food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2);

  // Serpiente
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    ctx.fillStyle = isHead ? "#00ff41" : "#008822";
    
    // Brillo en la cabeza
    if (isHead) {
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#00ff41";
    } else {
      ctx.shadowBlur = 0;
    }

    // Dibujado redondeado
    const r = isHead ? 6 : 3;
    const p = 2; // padding
    const x = seg.x * gridSize + p;
    const y = seg.y * gridSize + p;
    const w = gridSize - p*2;
    const h = gridSize - p*2;
    
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  });
}

// --- Controles ---
const keys = {
  ArrowUp: {x:0, y:-1}, w: {x:0, y:-1},
  ArrowDown: {x:0, y:1}, s: {x:0, y:1},
  ArrowLeft: {x:-1, y:0}, a: {x:-1, y:0},
  ArrowRight: {x:1, y:0}, d: {x:1, y:0}
};

window.addEventListener('keydown', e => {
  const move = keys[e.key];
  if (move) {
    // Evitar giro de 180 grados
    if (move.x !== -dir.x && move.y !== -dir.y) {
      nextDir = move;
    }
    if (e.key.startsWith('Arrow')) e.preventDefault();
  }
});

// Eventos de Botón (Garantizan el arranque)
document.getElementById('btn-start').onclick = startMatch;
document.getElementById('btn-restart').onclick = startMatch;

// Dibujo inicial para que no esté vacío
draw();
</script>
</body>
</html>
