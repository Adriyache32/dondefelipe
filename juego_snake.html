<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Arcade Pro</title>
  <style>
    :root {
      --neon-green: #00ff41;
      --neon-red: #ff3131;
      --neon-blue: #00d4ff;
      --bg-dark: #0a0a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Contenedor Principal */
    #game-container {
      position: relative;
      border: 4px solid #333;
      box-shadow: 0 0 50px rgba(0, 255, 65, 0.1);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Interfaz Superior */
    #ui-bar {
      width: 400px;
      background: #1a1a1a;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 15px;
      border-bottom: 2px solid #333;
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.1rem; font-weight: bold; color: var(--neon-green); }

    canvas { display: block; background: #000; cursor: none; }

    /* Pantallas de Superposición (Overlays) */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.3s;
    }
    .hidden { display: none; }

    h1 { font-size: 2.5rem; color: var(--neon-green); margin-bottom: 20px; text-shadow: 0 0 15px var(--neon-green); }
    
    input {
      background: #222;
      border: 2px solid var(--neon-green);
      color: #fff;
      padding: 10px;
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 20px;
      width: 150px;
      text-transform: uppercase;
    }

    button {
      background: var(--neon-green);
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover { transform: scale(1.05); background: #00cc33; }

    #lives { color: var(--neon-red); letter-spacing: 2px; }
    #msg { margin-top: 15px; font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-bar">
      <div>
        <div class="stat-label">Jugador</div>
        <div id="ui-player" class="stat-value">---</div>
      </div>
      <div>
        <div class="stat-label">Puntos</div>
        <div id="ui-score" class="stat-value">0</div>
      </div>
      <div>
        <div class="stat-label">Vidas</div>
        <div id="lives" class="stat-value">❤❤❤</div>
      </div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="start-overlay" class="overlay">
      <h1>SNAKE ARCADE</h1>
      <input type="text" id="player-name" maxlength="3" value="AAA">
      <button id="start-btn">INSERT COIN</button>
      <div id="msg">Usa las flechas o WASD</div>
    </div>

    <div id="death-overlay" class="overlay hidden">
      <h1 style="color:var(--neon-red); text-shadow: 0 0 15px var(--neon-red);">GAME OVER</h1>
      <div id="final-stats" style="margin-bottom: 20px; text-align: center;"></div>
      <button id="restart-btn">REINTENTAR</button>
    </div>
  </div>

<script>
/**
 * LÓGICA DEL JUEGO - VERSIÓN MEJORADA
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;

// Variables de estado
let snake, food, direction, nextDirection, score, lives, gameLoop, isRunning = false;
let playerName = "AAA";
const foodTypes = ['🐭', '🐹', '🐰', '🐿️'];

// Elementos DOM
const startOverlay = document.getElementById('start-overlay');
const deathOverlay = document.getElementById('death-overlay');
const uiScore = document.getElementById('ui-score');
const uiLives = document.getElementById('lives');
const uiPlayer = document.getElementById('ui-player');

// --- Inicialización ---

function initGame() {
  playerName = document.getElementById('player-name').value.toUpperCase() || "AAA";
  uiPlayer.textContent = playerName;
  
  score = 0;
  lives = 3;
  resetRound();
  
  startOverlay.classList.add('hidden');
  deathOverlay.classList.add('hidden');
  
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, 100); // Velocidad base
  isRunning = true;
}

function resetRound() {
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  spawnFood();
  updateUI();
}

function spawnFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount),
    icon: foodTypes[Math.floor(Math.random() * foodTypes.length)]
  };
  // Evitar que la comida aparezca sobre la serpiente
  if (snake.some(seg => seg.x === food.x && seg.y === food.y)) spawnFood();
}

// --- Motor del Juego ---

function update() {
  if (!isRunning) return;

  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  // 1. Colisión con Paredes (Teletransporte)
  if (head.x < 0) head.x = tileCount - 1;
  else if (head.x >= tileCount) head.x = 0;
  if (head.y < 0) head.y = tileCount - 1;
  else if (head.y >= tileCount) head.y = 0;

  // 2. Colisión con el Cuerpo
  if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
    handleDeath();
    return;
  }

  snake.unshift(head);

  // 3. Comer Comida
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateUI();
    spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function handleDeath() {
  lives--;
  updateUI();
  
  if (lives <= 0) {
    gameOver();
  } else {
    // Pausa momentánea al perder una vida
    isRunning = false;
    ctx.fillStyle = 'rgba(255,0,0,0.4)';
    ctx.fillRect(0,0, canvas.width, canvas.height);
    setTimeout(() => {
      resetRound();
      isRunning = true;
    }, 1000);
  }
}

function gameOver() {
  isRunning = false;
  clearInterval(gameLoop);
  document.getElementById('final-stats').innerHTML = `
    <p>PLAYER: ${playerName}</p>
    <p style="font-size: 1.5rem; color: var(--neon-green)">SCORE: ${score}</p>
  `;
  deathOverlay.classList.remove('hidden');
}

// --- Dibujado (Calidad Visual) ---

function draw() {
  // Fondo
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Rejilla sutil
  ctx.strokeStyle = '#111';
  for(let i=0; i<canvas.width; i+=gridSize) {
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
  }

  // Comida
  ctx.font = "16px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(food.icon, food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2);

  // Serpiente
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    ctx.fillStyle = isHead ? varColor('--neon-green') : '#008f11';
    
    // Efecto neón en la cabeza
    if (isHead) {
      ctx.shadowBlur = 15;
      ctx.shadowColor = varColor('--neon-green');
    } else {
      ctx.shadowBlur = 0;
    }

    // Dibujar segmento redondeado
    const padding = 2;
    drawRoundedRect(
      seg.x * gridSize + padding, 
      seg.y * gridSize + padding, 
      gridSize - padding*2, 
      gridSize - padding*2, 
      isHead ? 8 : 4
    );
  });
}

function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.fill();
}

function varColor(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function updateUI() {
  uiScore.textContent = score;
  uiLives.textContent = "
