<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego de Memoria</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#fff;padding:16px}
    h2{color:#ffd700;font-size:1.4rem;margin-bottom:8px;letter-spacing:1px}
    #info{margin-bottom:14px;font-size:.95rem;color:#aaa;text-align:center}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px;width:100%}
    .card{aspect-ratio:1;background:#16213e;border:2px solid #0f3460;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;cursor:pointer;transition:transform .15s,background .2s;user-select:none;-webkit-tap-highlight-color:transparent}
    .card:hover:not(.matched):not(.flipped){transform:scale(1.06);background:#1e2d50}
    .card.flipped{background:#0f3460;border-color:#4a7fc1}
    .card.matched{background:#1a3a1a;border-color:#ffd700;opacity:.75;cursor:default}
    #btn{margin-top:18px;padding:8px 28px;background:#ffd700;color:#1a1a2e;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer}
    #btn:hover{background:#ffe94d}
    #win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;flex-direction:column;z-index:99}
    #win.show{display:flex}
    #win-box{background:#16213e;border:2px solid #ffd700;border-radius:16px;padding:2rem 3rem;text-align:center}
    #win-box h3{color:#ffd700;font-size:1.6rem;margin-bottom:.5rem}
    #win-box p{color:#aaa;margin-bottom:1rem}
    #win-box button{padding:8px 24px;background:#ffd700;color:#1a1a2e;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <h2>🃏 JUEGO DE MEMORIA</h2>
  <div id="info">Intentos: 0 &nbsp;|&nbsp; Pares: 0 / 8</div>
  <div class="grid" id="grid"></div>
  <button id="btn" onclick="init()">🔄 Reiniciar</button>

  <div id="win">
    <div id="win-box">
      <h3>¡Felicitaciones! 🎉</h3>
      <p id="win-msg"></p>
      <button onclick="document.getElementById('win').classList.remove('show');init()">Jugar de nuevo</button>
    </div>
  </div>

<script>
const EMOJIS=['🚀','⭐','🌙','🪐','☄️','🔭','👽','🛸'];
let flipped=[],matched=0,moves=0,lock=false;

function shuffle(arr){return arr.sort(()=>Math.random()-.5);}

function init(){
  matched=0;moves=0;flipped=[];lock=false;
  updInfo();
  const pairs=shuffle([...EMOJIS,...EMOJIS]);
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  pairs.forEach((emoji,i)=>{
    const d=document.createElement('div');
    d.className='card';d.dataset.val=emoji;d.textContent='❓';
    d.addEventListener('click',()=>flip(d));
    grid.appendChild(d);
  });
}

function updInfo(){
  document.getElementById('info').textContent=`Intentos: ${moves}  |  Pares: ${matched} / 8`;
}

function flip(card){
  if(lock||flipped.length===2||card.classList.contains('matched')||card.classList.contains('flipped'))return;
  card.classList.add('flipped');card.textContent=card.dataset.val;
  flipped.push(card);
  if(flipped.length===2){
    moves++;lock=true;updInfo();
    if(flipped[0].dataset.val===flipped[1].dataset.val){
      flipped.forEach(c=>c.classList.add('matched'));
      matched++;updInfo();flipped=[];lock=false;
      if(matched===8){
        document.getElementById('win-msg').textContent=`Completaste el tablero en ${moves} intentos.`;
        setTimeout(()=>document.getElementById('win').classList.add('show'),400);
      }
    }else{
      setTimeout(()=>{
        flipped.forEach(c=>{c.classList.remove('flipped');c.textContent='❓';});
        flipped=[];lock=false;
      },900);
    }
  }
}

init();
</script>
</body>
</html>
