<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula de Ciencias | Profe Felipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ═══════════════════════════════════════════════
   TOKENS — Paleta Mediterránea / Ikariam
═══════════════════════════════════════════════ */
:root {
  --sea-deep:    #08182e;
  --sea-mid:     #112843;
  --sea-light:   #1a4068;
  --gold:        #c9a84c;
  --gold-light:  #e8c870;
  --gold-dark:   #8b6914;
  --marble:      #fcfaf7;
  --stone:       #ede5d0;
  --ivory:       #ffffff;
  --bronze:      #8e5431;
  --accent-red:  #8b1a1a;
  --text-main:   #2a241e;
  --text-soft:   #5d544b;
  --shadow-p:    0 10px 30px rgba(0,0,0,0.3);
  --glass:       rgba(255, 255, 255, 0.85);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cormorant Garamond', serif;
  background-color: var(--sea-deep);
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(26, 64, 104, 0.4) 0%, transparent 50%),
    url('https://www.transparenttextures.com/patterns/dark-matter.png');
  color: var(--text-main);
  line-height: 1.6;
  overflow-x: hidden;
}

h1, h2, h3, .shimmer { font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }

/* ═══════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════ */
.top-bar {
  background: linear-gradient(to right, var(--sea-deep), var(--sea-mid));
  border-bottom: 3px solid var(--gold);
  padding: 1.5rem 1rem;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.logo-container h1 { color: var(--gold-light); font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

nav.nav-menu {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-top: 15px;
}

/* Estilo de botones de navegación */
.btn-nav, .drop-btn {
  background: var(--sea-light);
  border: 1px solid var(--gold-dark);
  color: var(--gold-light);
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Cinzel', serif;
  font-size: 0.85rem;
  transition: all 0.3s ease;
  border-radius: 4px;
}

.btn-nav:hover, .drop-btn:hover {
  background: var(--gold);
  color: var(--sea-deep);
  box-shadow: 0 0 10px var(--gold);
}

/* ═══════════════════════════════════════════════
   DROPDOWN (Cursos)
═══════════════════════════════════════════════ */
.dropdown { position: relative; display: inline-block; }
.drop-content {
  display: none;
  position: absolute;
  background: var(--sea-mid);
  min-width: 180px;
  box-shadow: var(--shadow-p);
  border: 1px solid var(--gold);
  z-index: 1100;
  border-radius: 4px;
}
.drop-content a {
  color: var(--gold-light);
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  border-bottom: 1px solid rgba(201, 168, 76, 0.2);
}
.drop-content a:hover { background: var(--sea-light); color: var(--ivory); }
.dropdown:hover .drop-content { display: block; }

/* ═══════════════════════════════════════════════
   MAIN CONTAINER & IFRAME
═══════════════════════════════════════════════ */
main {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 15px;
}

.tablet-view {
  background: var(--stone);
  border: 8px double var(--gold-dark);
  border-radius: 15px;
  padding: 2rem;
  box-shadow: var(--shadow-p);
  min-height: 60vh;
}

.embed-frame {
  width: 100%;
  height: 75vh;
  border: 2px solid var(--gold-dark);
  border-radius: 8px;
  background: white;
}

.fade-in { animation: fadeIn 0.8s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ═══════════════════════════════════════════════
   JAVASCRIPT ROUTER
═══════════════════════════════════════════════ */
</style>
</head>
<body>

<header class="top-bar">
  <div class="logo-container">
    <h1><i class="fa-solid fa-microscope"></i> Aula de Ciencias</h1>
  </div>
  <nav class="nav-menu">
    <button class="btn-nav" onclick="go('inicio')">Inicio</button>
    
    <div class="dropdown">
      <button class="drop-btn">CURSOS <i class="fa-solid fa-chevron-down"></i></button>
      <div class="drop-content">
        <a href="#" onclick="go('tesoro')"><i class="fa-solid fa-gem"></i> VII° Básico</a>
        <a href="#" onclick="go('v_iii')">VIII° Básico</a>
      </div>
    </div>
    
    <button class="btn-nav" onclick="go('juegos')">Laboratorio</button>
  </nav>
</header>

<main>
  <div id="main-slot" class="tablet-view fade-in">
    <h2 style="text-align:center;">Bienvenido al Aula Digital</h2>
    <p style="text-align:center; margin-top:20px;">Selecciona una sección en el menú superior para comenzar.</p>
  </div>
</main>

<script>
function go(target) {
  const s = document.getElementById('main-slot');
  s.classList.remove('fade-in');
  void s.offsetWidth; // Trigger reflow
  s.classList.add('fade-in');

  if(target === 'inicio') {
    s.innerHTML = `<h2 style="text-align:center;">Bienvenido al Aula Digital</h2><p style="text-align:center; margin-top:20px;">Explora los recursos de ciencias y actividades interactivas.</p>`;
  }

  if(target === 'tesoro') {
    s.innerHTML = `
      <h2 class="shimmer"><i class="fa-solid fa-anchor"></i> Búsqueda del Tesoro - VII°</h2>
      <p style="margin-bottom:15px; color:var(--text-soft);">Actividad de exploración biológica.</p>
      <iframe src="tesoro_7basico.html" class="embed-frame"></iframe>
    `;
  }

  if(target === 'juegos') {
    s.innerHTML = `<h2>Laboratorio de Juegos</h2><p>Próximamente más simulaciones.</p>`;
  }

  window.scrollTo(0,0);
}
</script>

</body>
</html>
