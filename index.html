<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula de Ciencias | Profe Felipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   TOKENS  — Estética de Piedra y Mar
═══════════════════════════════════════════════ */
:root {
  --sea-deep:    #08182e;
  --gold:        #c9a84c;
  --gold-light:  #e8c870;
  --gold-dark:   #8b6914;
  --marble:      #f5f0e8;
  --stone:       #ede5d0;
  --ivory:       #faf7f2;
  --bronze:      #8e6a35;
  --text:        #2a1f10;
  --text-soft:   #6a5840;
  --ff-title: 'Cinzel','Palatino Linotype',serif;
  --ff-body:  'Cormorant Garamond',serif;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

body{
  min-height:100vh;
  display:flex;flex-direction:column;
  font-family:var(--ff-body);
  color:var(--text);
  background: linear-gradient(135deg, #08182e 0%, #152e50 100%);
  background-attachment: fixed;
}

.frieze{
  height:7px;
  background:repeating-linear-gradient(90deg, var(--gold-dark) 0, var(--gold-dark) 6px, var(--gold) 6px, var(--gold) 18px);
  z-index:100;
}

/* NAVEGACIÓN */
nav{
  position:sticky;top:0;z-index:200;
  background:rgba(6,18,34,.95);
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--gold-dark);
}

.nav-inner{
  max-width:1100px;margin:0 auto;
  height:65px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem;
}

.nav-brand{
  font-family:var(--ff-title);
  color:var(--gold-light);text-decoration:none;
  font-size:1.1rem;letter-spacing:3px;
  cursor: pointer;
}

.nav-menu{
  display:flex;list-style:none;gap:1.5rem;
  align-items: center;
}

.dropdown{position:relative;}

.drop-btn{
  background:none;border:none;cursor:pointer;
  font-family:var(--ff-title);font-size:.8rem;letter-spacing:1.5px;
  color:white;display:flex;align-items:center;gap:5px;
  padding:10px 0;
  text-decoration: none;
  transition: color 0.3s;
}

.drop-btn:hover { color: var(--gold-light); }

.drop-content{
  display:none;position:absolute;top:100%;left:0;
  min-width:200px;
  background:#050f1c;
  border:1px solid var(--gold-dark);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.dropdown:hover .drop-content{display:block;}

.drop-content a{
  display:block;padding:12px 20px;
  color:white;text-decoration:none;font-size:.9rem;
  border-bottom:1px solid rgba(255,255,255,0.05);
  font-family: var(--ff-body);
}
.drop-content a:hover{background:rgba(201,168,76,0.2);color:var(--gold-light);}

/* PANEL PRINCIPAL */
.main-panel{
  width:95%;max-width:1000px;
  margin:2rem auto;flex:1;
}

.tablet{
  background:var(--ivory);
  border:1px solid rgba(201,168,76,.3);
  border-radius:4px;
  padding:2.5rem;
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

h1{
  font-family:var(--ff-title);text-align:center;
  color:var(--bronze);letter-spacing:4px;margin-bottom:1.5rem;
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}

.card{
  background:var(--marble);
  border:1px solid rgba(201,168,76,.2);
  padding:1.5rem;border-left:4px solid var(--gold);
}

.btn-p{
  display:inline-block;margin-top:1rem;
  background:var(--gold-dark);color:white;
  padding:10px 20px;text-decoration:none;
  font-family:var(--ff-title);font-size:0.75rem;
  cursor: pointer;
}

.embed-frame{
  width:100%;height:780px;border:1px solid var(--stone);
  margin-top:1rem;background: white;
}

footer{
  background:#040a14;color:rgba(255,255,255,0.3);
  text-align:center;padding:1.5rem;font-size:0.7rem;
  font-family:var(--ff-title);border-top:2px solid var(--gold-dark);
}
</style>
</head>
<body>

<div class="frieze"></div>

<nav>
  <div class="nav-inner">
    <a href="#" class="nav-brand" onclick="render('home')">🏛️ PROFE FELIPE</a>
    <ul class="nav-menu">
      <li class="dropdown">
        <button class="drop-btn">MEDIA ▾</button>
        <div class="drop-content">
          <a href="#">III° Medio</a>
          <a href="#">IV° Medio</a>
        </div>
      </li>
      <li class="dropdown">
        <button class="drop-btn">⚽ DEPORTES ▾</button>
        <div class="drop-content">
          <a href="#" onclick="render('futbol_varones')">Liga Varones</a>
          <a href="#" onclick="render('futbol_damas')">Liga Damas</a>
        </div>
      </li>
      <li><a href="#" class="drop-btn">BIBLIOTECA</a></li>
    </ul>
  </div>
</nav>

<div class="main-panel">
  <div class="tablet" id="content"></div>
</div>

<footer>
  AULA DE CIENCIAS © 2026 - PROF. FELIPE JIMÉNEZ
</footer>

<script>
const content = document.getElementById('content');

function render(page) {
  if(page === 'home') {
    content.innerHTML = `
      <h1>AULA DE CIENCIAS</h1>
      <div class="grid">
        <div class="card">
          <h3>CAMPEONATO 2026</h3>
          <p>Resultados actualizados del Campeonato San Agustín.</p>
          <div style="display:flex; gap:10px; flex-wrap: wrap;">
            <a href="#" class="btn-p" onclick="render('futbol_varones')">LIGA VARONES</a>
            <a href="#" class="btn-p" onclick="render('futbol_damas')" style="background:#801d5e">LIGA DAMAS</a>
          </div>
        </div>
        <div class="card">
          <h3>CIENCIAS</h3>
          <p>Bitácoras y material de estudio disponible.</p>
        </div>
      </div>
    `;
  } else if(page === 'futbol_varones') {
    content.innerHTML = `
      <h1>LIGA VARONES 2026</h1>
      <iframe src="tablafutbol.html" class="embed-frame"></iframe>
    `;
  } else if(page === 'futbol_damas') {
    content.innerHTML = `
      <h1>LIGA DAMAS 2026</h1>
      <iframe src="tablafutbol_fem.html" class="embed-frame"></iframe>
    `;
  }
}

render('home');
</script>
</body>
</html>
