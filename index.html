<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula de Ciencias | Profe Felipe</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --marble: #f4f1ea;
    --ivory: #ffffff;
    --bronze: #8e735b;
    --gold-leaf: #c5a059;
    --text-main: #3a352f;
    --border-soft: rgba(142, 115, 91, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--marble);
    background-image: 
      linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)),
      url('https://www.transparenttextures.com/patterns/white-marble.png');
    font-family: 'Cormorant Garamond', serif;
    color: var(--text-main);
    line-height: 1.6;
  }

  /* ══ NAVEGACIÓN RESPONSIVA ══ */
  nav {
    background: var(--ivory);
    border-bottom: 3px solid var(--gold-leaf);
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s ease;
  }

  .nav-brand {
    font-family: 'Cinzel', serif;
    color: var(--bronze);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 2px;
  }

  .nav-menu { display: flex; list-style: none; gap: 1.5rem; }

  .dropdown { position: relative; }

  .drop-btn {
    background: none;
    border: none;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: var(--text-main);
    cursor: pointer;
    padding: 0.5rem;
    transition: color 0.3s;
  }

  .drop-btn:hover { color: var(--gold-leaf); }

  .drop-content {
    display: none;
    position: absolute;
    background: var(--ivory);
    min-width: 200px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    border: 1px solid var(--border-soft);
    padding: 0.5rem 0;
    top: 100%;
    right: 0; /* Alineado a la derecha para evitar desbordes */
  }

  .dropdown:hover .drop-content { display: block; }

  .drop-content a {
    display: block;
    padding: 0.8rem 1.5rem;
    color: var(--text-main);
    text-decoration: none;
    font-size: 1rem;
    border-bottom: 1px solid var(--border-soft);
  }

  /* ══ CONTENEDOR CENTRAL FLEXIBLE ══ */
  .main-stage {
    width: 92%;
    max-width: 1000px;
    margin: 2rem auto;
    background: var(--ivory);
    padding: 3rem;
    border: 1px solid var(--border-soft);
    box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    position: relative;
    min-height: 60vh;
  }

  .main-stage::before {
    content: '⚜';
    position: absolute;
    top: 15px; left: 15px;
    color: var(--gold-leaf);
    font-size: 1.2rem;
  }

  h1 {
    font-family: 'Cinzel', serif;
    text-align: center;
    color: var(--bronze);
    margin-bottom: 2rem;
    font-size: clamp(1.8rem, 5vw, 2.8rem); /* Tamaño fluido */
  }

  .welcome-text {
    text-align: center;
    font-size: clamp(1rem, 3vw, 1.3rem);
    font-style: italic;
  }

  footer {
    text-align: center;
    padding: 2rem;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    color: var(--bronze);
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* 📱 MEDIA QUERIES PARA CELULARES */
  @media (max-width: 768px) {
    nav {
      flex-direction: column;
      padding: 1rem;
    }

    .nav-menu {
      width: 100%;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .drop-btn {
      width: 100%;
      text-align: center;
      padding: 0.8rem;
      border: 1px solid var(--border-soft);
    }

    .drop-content {
      position: static;
      width: 100%;
      box-shadow: none;
      background: rgba(0,0,0,0.02);
    }

    .main-stage {
      padding: 1.5rem;
      width: 96%;
      margin: 1rem auto;
    }
  }

  .fade-in { animation: fadeIn 0.5s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-brand" onclick="loadContent('home')">PROFE FELIPE</a>
  
  <ul class="nav-menu">
    <li class="dropdown">
      <button class="drop-btn">Cursos Básica ▾</button>
      <div class="drop-content">
        <a href="#" onclick="loadContent('6basico')">6° Básico</a>
        <a href="#" onclick="loadContent('7basico')">7° Básico</a>
        <a href="#" onclick="loadContent('8basico')">8° Básico</a>
      </div>
    </li>
    <li class="dropdown">
      <button class="drop-btn">Cursos Media ▾</button>
      <div class="drop-content">
        <a href="#" onclick="loadContent('1medio')">1° Medio</a>
        <a href="#" onclick="loadContent('2medio')">2° Medio</a>
        <a href="#" onclick="loadContent('3medio')">3° Medio</a>
      </div>
    </li>
    <li class="dropdown">
      <button class="drop-btn">Asistentes IA ▾</button>
      <div class="drop-content">
        <a href="#" onclick="loadContent('ia-biologia')">IA Biología</a>
        <a href="#" onclick="loadContent('ia-fisica')">IA Física</a>
      </div>
    </li>
  </ul>
</nav>

<div class="main-stage" id="main-content">
  <div class="fade-in">
    <h1>Laboratorio del Conocimiento</h1>
    <div class="welcome-text">
      <p>Bienvenido al portal central de Ciencias. Selecciona tu nivel para acceder al material y desafíos.</p>
    </div>
  </div>
</div>

<footer>
  COLEGIO SAN AGUSTÍN · VILLA ALEMANA · 2026
</footer>

<script>
  function loadContent(page) {
    const content = document.getElementById('main-content');
    const pages = {
      'home': `
        <div class="fade-in">
          <h1>Laboratorio del Conocimiento</h1>
          <p class="welcome-text">Iniciando sesión en el sistema pedagógico...</p>
        </div>`,
      '1medio': `
        <div class="fade-in">
          <h1>1° Año Medio</h1>
          <p><strong>Unidad Actual:</strong> Biología Celular y Física de Ondas.</p>
          <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-soft);">
          <h3>Desafío de la Semana:</h3>
          <p>¿Cómo influye la frecuencia en la propagación del sonido?</p>
        </div>`,
      'ia-biologia': `
        <div class="fade-in">
          <h1>Tutor IA Biología</h1>
          <p><em>En conexión con la red de conocimiento...</em></p>
          <div style="margin-top:20px; padding: 15px; border-left: 4px solid var(--gold-leaf); background: #fafafa;">
             "La célula es la unidad básica de la vida..."
          </div>
        </div>`
    };

    content.innerHTML = pages[page] || `<h1>En construcción</h1><p>Estamos preparando este módulo científico.</p>`;
  }
</script>

</body>
</html>
