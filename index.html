<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula de Ciencias | Profe Felipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   TOKENS  — paleta mediterránea / Ikariam
═══════════════════════════════════════════════ */
:root {
  --sea-deep:    #08182e;
  --sea-mid:     #112843;
  --sea-light:   #1a4068;
  --gold:        #c9a84c;
  --gold-light:  #e8c870;
  --gold-dark:   #8b6914;
  --marble:      #f5f0e8;
  --stone:       #ede5d0;
  --ivory:       #faf7f2;
  --bronze:      #8e6a35;
  --text:        #2a1f10;
  --text-soft:   #6a5840;
  --laurel:      #4a7c59;
  --border-gold: rgba(201,168,76,.3);

  --ff-title: 'Cinzel','Palatino Linotype',Palatino,serif;
  --ff-body:  'Cormorant Garamond',Georgia,'Times New Roman',serif;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

body{
  min-height:100vh;
  display:flex;flex-direction:column;
  font-family:var(--ff-body);
  color:var(--text);
  background:linear-gradient(145deg,#08182e 0%,#0e2440 40%,#152e50 70%,#0a1e36 100%);
  background-size:400% 400%;
  animation:seaShift 16s ease infinite;
}

@keyframes seaShift{
  0%  {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.frieze{
  position:relative;z-index:100;
  height:7px;flex-shrink:0;
  background:repeating-linear-gradient(
    90deg,
    var(--gold-dark) 0,var(--gold-dark) 6px,
    var(--gold)      6px,var(--gold)      18px,
    #f0d87a           18px,#f0d87a          20px,
    var(--gold)      20px,var(--gold)      32px,
    var(--gold-dark) 32px,var(--gold-dark) 38px
  );
}

nav{
  position:sticky;top:0;z-index:200;flex-shrink:0;
  background:rgba(6,18,34,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:2px solid var(--gold-dark);
  box-shadow:0 4px 30px rgba(0,0,0,.45);
}

.nav-inner{
  max-width:1100px;margin:0 auto;
  padding:0 1.2rem;
  height:62px;
  display:flex;align-items:stretch;justify-content:space-between;
  position:relative;
}

.nav-brand{
  display:flex;align-items:center;gap:9px;
  font-family:var(--ff-title);
  color:var(--gold-light);text-decoration:none;
  font-size:1.05rem;letter-spacing:3px;
  padding:0 .5rem;
  border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s;
  flex-shrink:0;
}
.nav-brand:hover{color:#fff;border-bottom-color:var(--gold);}

.nav-menu{
  display:flex;align-items:stretch;list-style:none;gap:0;
}

.dropdown{position:relative;display:flex;align-items:stretch;}

.drop-btn{
  background:none;border:none;cursor:pointer;height:100%;
  padding:0 1.1rem;
  font-family:var(--ff-title);font-size:.8rem;letter-spacing:1.5px;
  color:rgba(255,255,255,.9);
  display:flex;align-items:center;gap:4px;
  border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s;
}
.drop-btn:hover,.drop-btn.active-menu{
  color:var(--gold-light);border-bottom-color:var(--gold);
}

.drop-content{
  display:none;position:absolute;top:100%;left:0;
  min-width:220px;
  background:rgba(5,15,28,.97);
  border:1px solid var(--gold-dark);border-top:2px solid var(--gold);
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  z-index:300;
}
.dropdown:hover .drop-content{display:block;}

.drop-content a{
  display:flex;justify-content:space-between;align-items:center;
  padding:.72rem 1.2rem;
  color:rgba(255,255,255,.88);text-decoration:none;font-size:.9rem;
  border-bottom:1px solid rgba(201,168,76,.1);
  transition:background .15s,color .15s;
}
.drop-content a:hover{background:rgba(201,168,76,0.12);color:var(--gold-light);}

.main-panel{
  position:relative;z-index:10;
  width:94%;max-width:1000px;
  margin:2rem auto;
  flex:1;
}

.tablet{
  background:var(--ivory);
  border:1px solid rgba(201,168,76,.2);
  border-radius:3px;
  padding:2.8rem 3rem;
  position:relative;overflow:hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

h1{
  font-family:var(--ff-title);
  font-size:clamp(1.4rem,4vw,2rem);
  letter-spacing:3px;
  color:var(--bronze);
  text-transform: uppercase;
}

h1.shimmer{
  background:linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-light),var(--gold),var(--gold-dark));
  background-size:300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:shimmer 5s linear infinite;
}
@keyframes shimmer{0%{background-position:0%}100%{background-position:300%}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px;}

.card{
  background:var(--marble);
  border:1px solid rgba(201,168,76,.18);
  border-radius:2px;padding:1.4rem 1.25rem;
  position:relative;
  transition:transform .22s,box-shadow .22s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.1);}

.btn-p{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:#fff;border:none;cursor:pointer;
  padding:.7rem 1.6rem;
  font-family:var(--ff-title);font-size:.82rem;letter-spacing:1px;
  border-radius:2px;text-decoration:none;
}

.btn-s{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;
  color:var(--bronze);border:1.5px solid rgba(201,168,76,.5);
  padding:.6rem 1.2rem;
  font-family:var(--ff-title);font-size:.78rem;letter-spacing:1px;
  border-radius:2px;cursor:pointer;text-decoration:none;
}

.embed-frame{width:100%;border:1px solid rgba(201,168,76,0.2);display:block;margin-top:1rem;min-height:750px;}

footer{
  background:rgba(4,10,20,.95);
  border-top:2px solid var(--gold-dark);
  padding:1.5rem 2rem;text-align:center;
  font-family:var(--ff-title);font-size:.68rem;
  letter-spacing:1px;color:rgba(255,255,255,.28);
}

.fade-in{animation:fadeIn 0.4s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div class="frieze"></div>

<nav>
  <div class="nav-inner">
    <a href="#" class="nav-brand" onclick="go('home');return false;">🏛️ PROFE FELIPE</a>
    <ul class="nav-menu">
      <li class="dropdown">
        <button class="drop-btn">BÁSICA ▾</button>
        <div class="drop-content">
          <a href="#" onclick="go('6basico')">VI° Básico</a>
          <a href="#" onclick="go('7basico')">VII° Básico</a>
          <a href="#" onclick="go('8basico')">VIII° Básico</a>
        </div>
      </li>
      <li class="dropdown">
        <button class="drop-btn">MEDIA ▾</button>
        <div class="drop-content">
          <a href="#" onclick="go('1medio')">I° Medio</a>
          <a href="#" onclick="go('2medio')">II° Medio</a>
          <a href="#" onclick="go('3medio')">III° Medio</a>
          <a href="#" onclick="go('4medio')">IV° Medio</a>
        </div>
      </li>
      <li class="dropdown">
        <button class="drop-btn">⚽ DEPORTES ▾</button>
        <div class="drop-content">
          <a href="#" onclick="go('futbol_varones')">Liga Varones</a>
          <a href="#" onclick="go('futbol_damas')">Liga Damas</a>
          <a href="#" onclick="go('goleadores')">⚽ Goleadores</a>
          <a href="#" onclick="go('calendario_futbol')">📅 Calendario</a>
          <a href="#" onclick="go('bases_futbol')">📜 Bases</a>
        </div>
      </li>
      <li><a href="#" onclick="go('juegos')" class="drop-btn">🎮 JUEGOS</a></li>
      <li><a href="#" onclick="go('biblioteca')" class="drop-btn">📁 BIBLIOTECA</a></li>
    </ul>
  </div>
</nav>

<div class="main-panel">
  <div class="tablet">
    <main id="main-content" class="fade-in"></main>
  </div>
</div>

<footer>
  AULA DE CIENCIAS © <span id="yr"></span> · PROF. FELIPE JIMÉNEZ
</footer>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFcG4150ORc85aIqbrAmtfBrZAol-iXB2I4RDEFMB87ESzTpE7vpoYIYpSPWL28Mas/exec';

const ROUTES = {
  home: rHome,
  '1medio': s => rComing(s, 'I° Medio'),
  '2medio': s => rComing(s, 'II° Medio'),
  '3medio': r3,
  '4medio': r4,
  '6basico': r6,
  '7basico': s => rComing(s, 'VII° Básico'),
  '8basico': s => rComing(s, 'VIII° Básico'),
  'futbol_varones': rFutbolVarones,
  'futbol_damas': rFutbolDamas,
  'goleadores': rGoleadores,
  'bases_futbol': rBasesFutbol,
  'calendario_futbol': rCalendarioFutbol,
  juegos: rJuegos,
  biblioteca: rLib
};

function go(page){
  const stage = document.getElementById('main-content');
  const fn = ROUTES[page];
  if(!fn) return;
  stage.innerHTML = '';
  fn(stage);
  window.scrollTo(0,0);
}

function rHome(stage){
  stage.innerHTML = `
    <div class="fade-in">
      <div class="tablet-header">
        <h1 class="shimmer">AULA DE CIENCIAS</h1>
        <p class="page-sub">Exploración, Ciencia y Deporte · 2026</p>
      </div>

      <h2 class="sh">NOVEDADES & DEPORTES</h2>
      <div class="grid">
        <div class="card c-gold">
          <h3>⚽ CAMPEONATO 2026</h3>
          <p>Ligas activas. Revisa goleadores, fechas y reglamento.</p>
          <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
            <button class="btn-p" onclick="go('goleadores')" style="flex:1">Goleadores</button>
            <button class="btn-s" onclick="go('calendario_futbol')" style="flex:1">Calendario</button>
          </div>
        </div>
        <div class="card c-laurel">
          <h3>🎮 SALA DE JUEGOS</h3>
          <p>Nuevos desafíos de las Toninas Marinas ya disponibles.</p>
          <button class="btn-p" onclick="go('juegos')" style="width:100%; margin-top:10px;">IR A JUGAR</button>
        </div>
      </div>
    </div>`;
}

function rGoleadores(s){ s.innerHTML = '<h1>TABLA DE GOLEADORES</h1><iframe src="goleadores.html" class="embed-frame"></iframe>'; }
function r3(s){ s.innerHTML = '<h1>III° Medio</h1><iframe src="bitacora_tech.html" class="embed-frame"></iframe>'; }
function r4(s){ s.innerHTML = '<h1>IV° Medio</h1><iframe src="tesoros_espacio.html" class="embed-frame"></iframe>'; }
function r6(s){ s.innerHTML = '<h1>VI° Básico</h1><iframe src="bitacora_6basico.html" class="embed-frame"></iframe>'; }
function rLib(s){ s.innerHTML = '<h1>Biblioteca</h1><iframe src="https://drive.google.com/embeddedfolderview?id=1_8SD_30CH4lAwBrLSg4sw9yKZiC9kNNJ#list" class="embed-frame"></iframe>'; }
function rFutbolVarones(s){ s.innerHTML = '<h1>LIGA VARONES</h1><iframe src="tablafutbol.html" class="embed-frame"></iframe>'; }
function rFutbolDamas(s){ s.innerHTML = '<h1>LIGA DAMAS</h1><iframe src="tablafutbol_fem.html" class="embed-frame"></iframe>'; }
function rBasesFutbol(s){ s.innerHTML = '<h1>BASES</h1><iframe src="bases_campeonato.html" class="embed-frame"></iframe>'; }
function rCalendarioFutbol(s){ s.innerHTML = '<h1>CALENDARIO</h1><iframe src="calendario_futbol.html" class="embed-frame"></iframe>'; }

function rJuegos(stage){
  stage.innerHTML = `<h1>🎮 SALA DE JUEGOS</h1><p>Pronto más juegos aquí.</p>`;
}

function rComing(s, name){
  s.innerHTML = `<div style="text-align:center; padding:4rem 2rem;"><h2>🔭 ${name}</h2><p>Módulo en preparación.</p></div>`;
}

document.getElementById('yr').textContent = new Date().getFullYear();
go('home');
</script>
</body>
</html>
