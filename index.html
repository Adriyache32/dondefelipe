<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula de Ciencias | Profe Felipe</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --marble: #f4f1ea;
    --ivory: #ffffff;
    --bronze: #8e735b;
    --gold-leaf: #c5a059;
    --text-main: #3a352f;
    --border-soft: rgba(142, 115, 91, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--marble);
    /* Textura sutil de mármol */
    background-image: 
      linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)),
      url('https://www.transparenttextures.com/patterns/white-marble.png');
    font-family: 'Cormorant Garamond', serif;
    color: var(--text-main);
    line-height: 1.6;
  }

  /* ══ NAVEGACIÓN ESTILO TEMPLO ══ */
  nav {
    background: var(--ivory);
    border-bottom: 3px solid var(--gold-leaf);
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-brand {
    font-family: 'Cinzel', serif;
    color: var(--bronze);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 2px;
  }

  .nav-menu { display: flex; list-style: none; gap: 2rem; }

  .dropdown { position: relative; }

  .drop-btn {
    background: none;
    border: none;
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    color: var(--text-main);
    cursor: pointer;
    padding: 0.5rem;
    transition: color 0.3s;
  }

  .drop-btn:hover { color: var(--gold-leaf); }

  .drop-content {
    display: none;
    position: absolute;
    background: var(--ivory);
    min-width: 200px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    border: 1px solid var(--border-soft);
    padding: 0.5rem 0;
    top: 100%;
  }

  .dropdown:hover .drop-content { display: block; }

  .drop-content a {
    display: block;
    padding: 0.8rem 1.5rem;
    color: var(--text-main);
    text-decoration: none;
    font-size: 1rem;
    border-bottom: 1px solid var(--border-soft);
  }

  .drop-content a:hover {
    background: var(--marble);
    color: var(--gold-leaf);
  }

  /* ══ CONTENEDOR CENTRAL (EL "PODIO") ══ */
  .main-stage {
    max-width: 1000px;
    margin: 3rem auto;
    background: var(--ivory);
    padding: 4rem;
    border: 1px solid var(--border-soft);
    box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    position: relative;
    min-height: 60vh;
  }

  /* Esquinas decorativas estilo Ikariam */
  .main-stage::before {
    content: '⚜';
    position: absolute;
    top: 10px; left: 10px;
    color: var(--gold-leaf);
    font-size: 1.2rem;
  }

  h1 {
    font-family: 'Cinzel', serif;
    text-align: center;
    color: var(--bronze);
    margin-bottom: 2rem;
    font-size: 2.5rem;
  }

  .welcome-text {
    text-align: center;
    font-size: 1.3rem;
    font-style: italic;
  }

  /* ══ FOOTER ══ */
  footer {
    text-align: center;
    padding: 2rem;
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    color: var(--bronze);
    letter-spacing: 1px;
  }

  /* Clase para animar la carga de contenido */
  .fade-in {
    animation: fadeIn 0.5s ease-in;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-brand" onclick="loadContent('home')">PROFE FELIPE</a>
  
  <ul class="nav-menu">
    <li class="dropdown">
      <button class="drop-btn">Cursos Básica ▾</button>
      <div class="drop-content">
        <a href="#" onclick="loadContent('6basico')">6° Básico</a>
        <a href="#" onclick="loadContent('7basico')">7° Básico</a>
        <a href="#" onclick="loadContent('8basico')">8° Básico</a>
      </div>
    </li>
    <li class="dropdown">
      <button class="drop-btn">Cursos Media ▾</button>
      <div class="drop-content">
        <a href="#" onclick="loadContent('1medio')">1° Medio</a>
        <a href="#" onclick="loadContent('2medio')">2° Medio</a>
        <a href="#" onclick="loadContent('3medio')">3° Medio</a>
      </div>
    </li>
    <li class="dropdown">
      <button class="drop-btn">Asistentes IA ▾</button>
      <div class="drop-content">
        <a href="#" onclick="loadContent('ia-biologia')">IA Biología</a>
        <a href="#" onclick="loadContent('ia-fisica')">IA Física</a>
      </div>
    </li>
  </ul>
</nav>

<div class="main-stage" id="main-content">
  <div class="fade-in">
    <h1>Laboratorio del Conocimiento</h1>
    <div class="welcome-text">
      <p>Bienvenido, buscador del saber. Selecciona tu curso en el menú superior para comenzar la exploración científica.</p>
    </div>
    <div style="text-align: center; margin-top: 3rem; color: var(--gold-leaf); font-size: 3rem;">
      ⚗️
    </div>
  </div>
</div>

<footer>
  COLEGIO SAN AGUSTÍN · CIENCIAS NATURALES · 2026
</footer>

<script>
  // Esta función simula la carga de páginas dentro del mismo sitio
  function loadContent(page) {
    const content = document.getElementById('main-content');
    
    // Aquí definimos qué texto mostrar para cada "página"
    const pages = {
      'home': `
        <div class="fade-in">
          <h1>Laboratorio del Conocimiento</h1>
          <p class="welcome-text">Bienvenido al portal central de Ciencias.</p>
        </div>`,
      '6basico': `
        <div class="fade-in">
          <h1>6° Año Básico</h1>
          <p>Explorando los sistemas de la Tierra y la vida.</p>
          <ul>
            <li>Material de estudio: Fotosíntesis</li>
            <li>Desafío: El ciclo del agua</li>
          </ul>
        </div>`,
      '1medio': `
        <div class="fade-in">
          <h1>1° Año Medio</h1>
          <p>Introducción a la Biología Celular y Física de Ondas.</p>
          <button style="margin-top:20px; padding:10px; background:var(--gold-leaf); color:white; border:none; cursor:pointer;">
            Ver Nube del Curso
          </button>
        </div>`,
      'ia-biologia': `
        <div class="fade-in">
          <h1>Asistente de Biología</h1>
          <p><em>Módulo de IA en desarrollo...</em></p>
          <div style="border: 1px solid var(--border-soft); padding: 20px; background: var(--marble);">
            Pregúntame sobre células, genética o evolución.
          </div>
        </div>`
    };

    // Actualizamos el contenido central
    content.innerHTML = pages[page] || `<h1>Página en construcción</h1><p>Pronto habrá material aquí.</p>`;
  }
</script>

</body>
</html>
