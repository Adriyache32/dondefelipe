<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servidor de Minecraft San Agustín · El Rincón de Felipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIGURA AQUÍ TU SERVIDOR
     Cambia esta dirección por la de tu túnel playit.gg
     Ej: "algo.gl.at.ply.gg" o "algo.gl.at.ply.gg:PUERTO"
     ============================================================ */

  :root{
    --noche:      #12100E;   /* fondo, cueva de noche       */
    --piedra:     #1E1A16;   /* superficie de tarjetas      */
    --slot:       #2A2621;   /* hueco de inventario         */
    --slot-luz:   #3B352E;   /* bisel superior del slot     */
    --slot-sombra:#0C0A08;   /* bisel inferior del slot     */
    --esmeralda:  #3DD68C;   /* online, vivo                */
    --redstone:   #D14D3C;   /* offline                     */
    --oro:        #E6B655;   /* dato destacado              */
    --musgo:      #8A8175;   /* texto secundario            */
    --hueso:      #EDE8DF;   /* texto principal             */
    --borde:      #35302A;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a1712 0%, transparent 60%),
      var(--noche);
    color:var(--hueso);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding:clamp(16px,4vw,48px);
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:820px;margin:0 auto}

  /* ---------- Encabezado ---------- */
  header{
    display:flex;align-items:center;gap:16px;
    flex-wrap:wrap;margin-bottom:28px;
  }
  .logo{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(13px,3vw,18px);
    line-height:1.5;color:var(--hueso);
    letter-spacing:0.5px;
  }
  .logo .verde{color:var(--esmeralda)}
  .marca{display:flex;flex-direction:column;gap:8px}
  .subtitulo{
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
    text-transform:uppercase;letter-spacing:2px;color:var(--musgo);
    display:flex;align-items:center;gap:8px;
  }
  .subtitulo::before{
    content:"";width:9px;height:9px;background:var(--esmeralda);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.25),inset -2px -2px 0 rgba(0,0,0,.3);
  }

  /* Signature: bloque de estado que late */
  .estado-bloque{
    margin-left:auto;display:flex;align-items:center;gap:12px;
    font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
    text-transform:uppercase;letter-spacing:1.5px;
  }
  .bloque{
    width:22px;height:22px;position:relative;
    image-rendering:pixelated;
    background:var(--musgo);
    box-shadow:
      inset 3px 3px 0 rgba(255,255,255,.18),
      inset -3px -3px 0 rgba(0,0,0,.35);
  }
  .bloque.on{background:var(--esmeralda);animation:latido 1.6s ease-in-out infinite}
  .bloque.off{background:var(--redstone)}
  @keyframes latido{
    0%,100%{box-shadow:inset 3px 3px 0 rgba(255,255,255,.18),inset -3px -3px 0 rgba(0,0,0,.35),0 0 0 0 rgba(61,214,140,.5)}
    50%{box-shadow:inset 3px 3px 0 rgba(255,255,255,.18),inset -3px -3px 0 rgba(0,0,0,.35),0 0 14px 3px rgba(61,214,140,.35)}
  }
  .estado-txt.on{color:var(--esmeralda)}
  .estado-txt.off{color:var(--redstone)}
  .estado-txt.wait{color:var(--musgo)}

  /* ---------- Barra de dirección ---------- */
  .barra{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;
  }
  .barra input{
    flex:1;min-width:200px;
    background:var(--piedra);border:1px solid var(--borde);
    color:var(--hueso);font-family:'JetBrains Mono',monospace;font-size:14px;
    padding:12px 14px;border-radius:6px;
  }
  .barra input:focus{outline:2px solid var(--esmeralda);outline-offset:-1px}
  .barra button{
    background:var(--esmeralda);color:#0d1f16;border:none;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;
    padding:12px 22px;border-radius:6px;cursor:pointer;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);
    transition:transform .08s;
  }
  .barra button:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}

  /* ---------- Panel principal ---------- */
  .panel{
    background:var(--piedra);border:1px solid var(--borde);
    border-radius:12px;padding:clamp(18px,3vw,28px);
  }

  .fila-cabecera{display:flex;align-items:center;gap:16px;margin-bottom:22px}
  .icono-srv{
    width:56px;height:56px;border-radius:6px;image-rendering:pixelated;
    background:var(--slot);flex-shrink:0;
    box-shadow:inset 2px 2px 0 var(--slot-luz),inset -2px -2px 0 var(--slot-sombra);
  }
  .motd{font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.5;color:var(--musgo);white-space:pre-wrap}
  .direccion{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--oro);margin-top:4px}

  /* Métricas */
  .metricas{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px;margin-bottom:26px;
  }
  .metrica{
    background:var(--noche);border:1px solid var(--borde);border-radius:8px;
    padding:16px;
  }
  .metrica .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;color:var(--oro);line-height:1}
  .metrica .n .max{font-size:16px;color:var(--musgo)}
  .metrica .l{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--musgo);margin-top:8px}

  /* Inventario de jugadores */
  .sec-titulo{
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:2px;color:var(--musgo);
    margin-bottom:14px;display:flex;align-items:center;gap:10px;
  }
  .sec-titulo::after{content:"";flex:1;height:1px;background:var(--borde)}

  .inventario{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;
  }
  .slot{
    background:var(--slot);border-radius:4px;padding:10px 6px;text-align:center;
    box-shadow:inset 3px 3px 0 var(--slot-luz),inset -3px -3px 0 var(--slot-sombra);
  }
  .slot img{width:40px;height:40px;image-rendering:pixelated;border-radius:2px;background:var(--noche)}
  .slot .nom{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--hueso);
    margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .aviso-query{
    font-size:12px;color:var(--musgo);line-height:1.6;
    background:var(--noche);border:1px dashed var(--borde);border-radius:8px;padding:14px;
  }
  .aviso-query code{color:var(--oro);font-family:'JetBrains Mono',monospace}

  /* Estados vacío / error */
  .vacio{text-align:center;padding:30px 10px;color:var(--musgo);font-family:'JetBrains Mono',monospace;font-size:14px}
  .error{color:var(--redstone)}

  /* Pie: refresco */
  footer{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    margin-top:22px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--musgo);
  }
  footer a{color:var(--oro)}
  .contador{color:var(--esmeralda)}

  @media (prefers-reduced-motion:reduce){
    .bloque.on{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="marca">
      <div class="logo">EL RINCÓN<br><span class="verde">DE FELIPE</span></div>
      <div class="subtitulo">Servidor de Minecraft · San Agustín</div>
    </div>
    <div class="estado-bloque">
      <span class="bloque" id="bloque"></span>
      <span class="estado-txt wait" id="estadoTxt">consultando…</span>
    </div>
  </header>

  <div class="barra">
    <input id="dir" type="text" placeholder="tu-servidor.gl.at.ply.gg  (o con :puerto)" spellcheck="false">
    <button id="btn">Consultar</button>
  </div>

  <div class="panel">
    <div class="fila-cabecera">
      <img class="icono-srv" id="icono" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
      <div>
        <div class="motd" id="motd">Ingresa la dirección de tu servidor y pulsa Consultar.</div>
        <div class="direccion" id="direccion"></div>
      </div>
    </div>

    <div class="metricas">
      <div class="metrica">
        <div class="n" id="mJugadores">—</div>
        <div class="l">Jugadores</div>
      </div>
      <div class="metrica">
        <div class="n" id="mVersion" style="font-size:15px">—</div>
        <div class="l">Versión</div>
      </div>
      <div class="metrica">
        <div class="n" id="mSoftware" style="font-size:15px">—</div>
        <div class="l">Software</div>
      </div>
    </div>

    <div class="sec-titulo">Conectados ahora</div>
    <div id="zonaJugadores">
      <div class="vacio">—</div>
    </div>
  </div>

  <footer>
    <span>Próxima actualización en <span class="contador" id="contador">—</span></span>
    <span>Datos vía <a href="https://api.mcsrvstat.us/" target="_blank" rel="noopener">mcsrvstat.us</a></span>
  </footer>

</div>

<script>
  // ====== CONFIGURA TU DIRECCIÓN AQUÍ (o escríbela en el campo de arriba) ======
  const SERVIDOR_POR_DEFECTO = "version-charleston.gl.joinmc.link";   // ej: "mi-server.gl.at.ply.gg"
  const SEGUNDOS_REFRESCO   = 45;    // cada cuánto se re-consulta
  // ============================================================================

  const $ = id => document.getElementById(id);
  let cuenta = SEGUNDOS_REFRESCO;
  let timerConsulta, timerCuenta;

  if (SERVIDOR_POR_DEFECTO) $('dir').value = SERVIDOR_POR_DEFECTO;

  function setEstado(clase, texto){
    $('bloque').className = 'bloque ' + clase;
    $('estadoTxt').className = 'estado-txt ' + clase;
    $('estadoTxt').textContent = texto;
  }

  async function consultar(){
    const dir = $('dir').value.trim();
    if(!dir){ setEstado('wait','sin dirección'); return; }

    setEstado('wait','consultando…');
    try{
      const r = await fetch('https://api.mcsrvstat.us/3/' + encodeURIComponent(dir));
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      pintar(d, dir);
    }catch(e){
      setEstado('off','error');
      $('motd').innerHTML = '<span class="error">No se pudo consultar la API. Revisa la dirección o vuelve a intentar en un momento.</span>';
      $('zonaJugadores').innerHTML = '<div class="vacio error">Sin datos</div>';
    }
    reiniciarContador();
  }

  function pintar(d, dir){
    $('direccion').textContent = dir;

    if(!d.online){
      setEstado('off','offline');
      $('icono').src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
      $('motd').textContent = 'El servidor está apagado o no responde en este momento.';
      $('mJugadores').innerHTML = '0';
      $('mVersion').textContent = '—';
      $('mSoftware').textContent = '—';
      $('zonaJugadores').innerHTML = '<div class="vacio">Nadie conectado — servidor offline</div>';
      return;
    }

    setEstado('on','online');

    // Ícono del servidor (viene como data URI base64)
    if(d.icon) $('icono').src = d.icon;

    // MOTD (motd.clean es un arreglo de líneas)
    const motd = (d.motd && d.motd.clean) ? d.motd.clean.join('\n') : 'Servidor en línea';
    $('motd').textContent = motd;

    // Métricas
    const on  = d.players ? d.players.online : 0;
    const max = d.players ? d.players.max : '—';
    $('mJugadores').innerHTML = on + ' <span class="max">/ ' + max + '</span>';
    $('mVersion').textContent  = d.version || '—';
    $('mSoftware').textContent = d.software || 'Java';

    // Inventario de jugadores conectados
    const lista = (d.players && d.players.list) ? d.players.list : [];
    if(on === 0){
      $('zonaJugadores').innerHTML = '<div class="vacio">Nadie conectado por ahora</div>';
    }else if(lista.length === 0){
      // Hay jugadores pero query está desactivado: no llegan los nombres
      $('zonaJugadores').innerHTML =
        '<div class="aviso-query">Hay <strong>' + on + '</strong> jugador(es) conectado(s), pero no llegan los nombres. '+
        'Para ver la lista, activa <code>enable-query=true</code> en <code>server.properties</code> y reinicia el servidor.</div>';
    }else{
      let html = '<div class="inventario">';
      for(const p of lista){
        const id = p.uuid || p.name;
        html += '<div class="slot">'
              + '<img loading="lazy" src="https://mc-heads.net/avatar/'+encodeURIComponent(id)+'/40" alt="">'
              + '<div class="nom">'+escapar(p.name)+'</div>'
              + '</div>';
      }
      html += '</div>';
      $('zonaJugadores').innerHTML = html;
    }
  }

  function escapar(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function reiniciarContador(){
    cuenta = SEGUNDOS_REFRESCO;
    $('contador').textContent = cuenta + 's';
    clearInterval(timerCuenta);
    timerCuenta = setInterval(()=>{
      cuenta--;
      $('contador').textContent = (cuenta>0? cuenta : 0) + 's';
      if(cuenta<=0){ clearInterval(timerCuenta); consultar(); }
    },1000);
  }

  $('btn').addEventListener('click', consultar);
  $('dir').addEventListener('keydown', e=>{ if(e.key==='Enter') consultar(); });

  // Arranque
  if(SERVIDOR_POR_DEFECTO) consultar();
  else { setEstado('wait','sin dirección'); $('contador').textContent='—'; }
</script>
</body>
</html>
