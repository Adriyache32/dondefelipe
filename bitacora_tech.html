<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BITÁCORA::TECH — III° Medio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
  :root { --primary: #00f2ff; --accent: #f0c840; --bg: #070a14; }
  body { background: var(--bg); color: #c3cce9; font-family: 'Courier New', monospace; padding: 15px; }
  .card { border: 1px solid #1d2640; padding: 20px; margin-bottom: 20px; background: rgba(15,20,40,0.7); }
  h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid var(--primary); }
  label { display: block; margin-top: 10px; color: var(--accent); font-size: 0.8rem; }
  input, textarea { width: 100%; background: #0c1120; border: 1px solid #1d2640; color: #00f2ff; padding: 8px; margin-top: 5px; }
  .controls { display: flex; gap: 10px; margin-top: 20px; }
  button { 
    background: none; border: 1px solid var(--primary); color: var(--primary); 
    padding: 10px 15px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
  }
  button:hover { background: rgba(0,242,255,0.1); }
  .btn-email { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="card">
  <h2>01_IDENTIFICACIÓN</h2>
  <label>TÍTULO DEL PROYECTO</label>
  <input type="text" id="p-title">
  <label>EQUIPO / ESTUDIANTE</label>
  <input type="text" id="p-team">
</div>

<div class="card">
  <h2>02_EL_PROBLEMA</h2>
  <label>CONTEXTO Y DESAFÍO</label>
  <textarea id="p-problem" rows="4"></textarea>
</div>

<div class="controls">
  <button onclick="exportarPDF()">DESCARGAR PDF</button>
  <button id="btn-email" class="btn-email" onclick="enviarAlProfe()">ENVIAR AL PROFE ⚜️</button>
</div>

<script>
  (function() {
      // Tu Public Key ya integrada
      emailjs.init("_CmZvn9OMlsXqgdv4");
  })();

  function snapshot() {
      return {
          title: document.getElementById('p-title').value,
          team: document.getElementById('p-team').value,
          problem: document.getElementById('p-problem').value
      };
  }

  async function enviarAlProfe() {
      const s = snapshot();
      const btn = document.getElementById("btn-email");
      if(!s.team) { alert("Por favor, ingresa tu nombre o el de tu equipo."); return; }

      btn.innerText = "TRANSMITIENDO...";
      btn.disabled = true;

      const templateParams = {
          from_name: s.team,
          project_title: s.title,
          summary: s.problem
      };

      try {
          // Nota: Revisa que en EmailJS tu servicio se llame 'default_service' 
          // y tu plantilla 'template_bitacora'
          await emailjs.send('default_service', 'template_bitacora', templateParams);
          alert("¡Misión cumplida! Bitácora enviada al Profe Felipe.");
          btn.innerText = "ENVIADO ✓";
      } catch (err) {
          console.error(err);
          alert("Error de conexión. Descarga el PDF y envíalo manualmente.");
          btn.innerText = "REINTENTAR";
          btn.disabled = false;
      }
  }

  function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const s = snapshot();
      doc.setFont("courier");
      doc.text("BITÁCORA TÉCNICA :: III MEDIO", 10, 10);
      doc.text("-----------------------------", 10, 15);
      doc.text("Proyecto: " + s.title, 10, 25);
      doc.text("Equipo: " + s.team, 10, 35);
      doc.text("Problema:", 10, 45);
      doc.text(s.problem, 10, 55, { maxWidth: 180 });
      doc.save("bitacora_" + s.team + ".pdf");
  }
</script>
</body>
</html>
